<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F2EEE5;--card:#FCFAF4;--ink:#3B2E24;--red:#8E1F1D;
  --salmon:#F5A38B;--red-soft:#F7DACC;--rose:#B08D7C;--amber:#B86E2A;
  --muted:#8B7C6B;--line:#E6E0D2;--done:#E3D9C2;--done-line:#D6C9AA;--btn:#E2D8C0;--sel:#D2C5A2;--sel-line:#BFB088;
  --grp:#9C6B3F;--ach-bg:#F7F1DC;--ach-line:#E6D9B4;
  --blaa:#87A7BC;--blaa-skygge:#3E7C96;--ballongsnor:#B08D7C;--lv1:#7A2E28;--lv2:#9C3D2E;--lv3:#BF5638;--lv4:#E07348;--lv5:#FF9466;--lv6:#C68A1E;--lv7:#4E7B8C;
  --font:"Nunito","Helvetica Neue",Helvetica,Arial,sans-serif;
}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;min-height:100vh}
button,.chip,.icon-btn,.cb-item,.inp,select,textarea{touch-action:manipulation}
.pin-bg{touch-action:manipulation}

/* ── Layout: sidebar + main ── */
.layout{display:flex;min-height:100vh}
.sidebar{
  width:230px;background:var(--card);border-right:1px solid var(--line);
  padding:16px 0 40px;flex-shrink:0;overflow-y:auto;
  position:fixed;top:0;bottom:0;left:0;z-index:150;
  transform:translateX(-100%);transition:transform .2s;
}
.sidebar.open{transform:translateX(0)}
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:140;display:none}
.sidebar-overlay.show{display:block}
.main{flex:1;min-width:0;padding-bottom:100px}
@media(min-width:900px){
  .sidebar{transform:none;position:sticky;height:100vh}
  .sidebar-overlay{display:none!important}
  .main{margin-left:0}
  .menu-btn{display:none}
}

/* Sidebar innhold */
.side-month{display:flex;align-items:center;gap:8px;padding:8px 18px;cursor:pointer;user-select:none;font-size:14px;font-weight:600;color:var(--ink)}
.side-month:hover{background:var(--bg)}
.s-arrow{width:14px;flex-shrink:0;color:var(--red);font-size:10px;transition:transform .15s;display:inline-flex;justify-content:center}
.s-arrow.open{transform:rotate(90deg)}

/* Topbar */
.topbar{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--line);padding:0}
.topbar-row{display:flex;align-items:center;gap:10px;margin-bottom:0;padding:14px 16px 10px;background:var(--bg)}
.stripe-ribbon{height:7px;background:linear-gradient(to right,#BDDBCF 0.0% 3.704%,#74A491 3.704% 7.407%,#276337 7.407% 11.111%,#4E6B5C 11.111% 14.815%,#8A8B5C 14.815% 18.519%,#388A87 18.519% 22.222%,#394560 22.222% 25.926%,#4E7B8C 25.926% 29.63%,#87A7BC 29.63% 33.333%,#B0CBDD 33.333% 37.037%,#D7E4EA 37.037% 40.741%,#553C67 40.741% 44.444%,#8C5A74 44.444% 48.148%,#8B7A9E 48.148% 51.852%,#D2C4DE 51.852% 55.556%,#883A2B 55.556% 59.259%,#C64739 59.259% 62.963%,#C46E7E 62.963% 66.667%,#DE9273 66.667% 70.37%,#E7C5CB 70.37% 74.074%,#CC7F33 74.074% 77.778%,#E2C878 77.778% 81.481%,#C2AC85 81.481% 85.185%,#DFCBB9 85.185% 88.889%,#A88A6B 88.889% 92.593%,#9C6B3F 92.593% 96.296%,#6F4E37 96.296% 100.0%)}
.stripe-thin{height:3.5px;border-radius:2px;margin:8px 12px 2px;background:linear-gradient(to right,#BDDBCF 0.0% 3.704%,#74A491 3.704% 7.407%,#276337 7.407% 11.111%,#4E6B5C 11.111% 14.815%,#8A8B5C 14.815% 18.519%,#388A87 18.519% 22.222%,#394560 22.222% 25.926%,#4E7B8C 25.926% 29.63%,#87A7BC 29.63% 33.333%,#B0CBDD 33.333% 37.037%,#D7E4EA 37.037% 40.741%,#553C67 40.741% 44.444%,#8C5A74 44.444% 48.148%,#8B7A9E 48.148% 51.852%,#D2C4DE 51.852% 55.556%,#883A2B 55.556% 59.259%,#C64739 59.259% 62.963%,#C46E7E 62.963% 66.667%,#DE9273 66.667% 70.37%,#E7C5CB 70.37% 74.074%,#CC7F33 74.074% 77.778%,#E2C878 77.778% 81.481%,#C2AC85 81.481% 85.185%,#DFCBB9 85.185% 88.889%,#A88A6B 88.889% 92.593%,#9C6B3F 92.593% 96.296%,#6F4E37 96.296% 100.0%)}
.stripe-hair{height:5px;border-radius:2px;margin:8px 0 10px;background:linear-gradient(to right,#BDDBCF 0.0% 3.704%,#74A491 3.704% 7.407%,#276337 7.407% 11.111%,#4E6B5C 11.111% 14.815%,#8A8B5C 14.815% 18.519%,#388A87 18.519% 22.222%,#394560 22.222% 25.926%,#4E7B8C 25.926% 29.63%,#87A7BC 29.63% 33.333%,#B0CBDD 33.333% 37.037%,#D7E4EA 37.037% 40.741%,#553C67 40.741% 44.444%,#8C5A74 44.444% 48.148%,#8B7A9E 48.148% 51.852%,#D2C4DE 51.852% 55.556%,#883A2B 55.556% 59.259%,#C64739 59.259% 62.963%,#C46E7E 62.963% 66.667%,#DE9273 66.667% 70.37%,#E7C5CB 70.37% 74.074%,#CC7F33 74.074% 77.778%,#E2C878 77.778% 81.481%,#C2AC85 81.481% 85.185%,#DFCBB9 85.185% 88.889%,#A88A6B 88.889% 92.593%,#9C6B3F 92.593% 96.296%,#6F4E37 96.296% 100.0%)}
.stripe-rund{height:9px;border-radius:3px}
.menu-btn{background:none;border:1px solid var(--line);border-radius:8px;font-size:16px;padding:4px 10px;cursor:pointer;color:var(--ink)}
h1{font-size:24px;font-weight:800;letter-spacing:0.5px;flex:1;color:var(--title,var(--ink));font-family:var(--font-heading,inherit)}
.edit-btn{font-size:13px;font-weight:600;color:var(--muted);background:none;border:none;cursor:pointer;font-family:inherit}
.edit-btn.on{color:var(--red)}
.icon-btn{font-size:12px;font-weight:600;color:var(--muted);background:none;border:1px solid var(--line);border-radius:8px;padding:4px 9px;cursor:pointer;font-family:inherit}
.tabs{display:flex;gap:2px;padding:4px 16px 0}
.tab{flex:1;padding:9px 0;border:none;background:none;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;font-family:inherit}
.tab.on{color:var(--red);border-bottom-color:var(--red)}

/* Innhold */
.view-title{font-size:21px;font-weight:800;letter-spacing:-.2px;color:var(--title,var(--ink));padding:18px 16px 2px;line-height:1.25;font-family:var(--font-heading,inherit)}
.sec-title{font-size:15px;font-weight:700;color:var(--ink);padding:20px 16px 4px;font-family:var(--font-heading,inherit)}
.view-sub{font-size:12px;color:var(--muted);padding:0 16px 8px;line-height:1.55}
.card{background:var(--card);border-radius:14px;overflow:hidden;margin:8px 12px 4px;border:1px solid var(--line)}
.entry-row{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.entry-row.tett{padding:4px 14px;align-items:center}
.entry-row.tett .entry-text{font-size:12.5px;line-height:1.3}
.entry-row.tett .entry-date{font-size:10.5px;line-height:1.25}
.entry-row:last-child{border-bottom:none}
.entry-dot{width:5px;height:5px;border-radius:99px;background:var(--rose);flex-shrink:0;margin-top:8px}
.entry-body{flex:1;min-width:0}
.entry-text{font-size:13px;color:var(--ink);line-height:1.5}
.entry-date{font-size:11px;color:var(--rose);margin-top:1px}
.entry-cats{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.entry-cat{font-size:10px;color:var(--ink);background:var(--done);padding:2px 7px;border-radius:99px}
.cat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;display:inline-block}
.col-sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;flex-shrink:0}
.col-sw.on{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--card)}
.col-sw.none{background:transparent;border:1.5px dashed var(--muted);color:var(--muted);font-size:11px}
.col-sw.none.on{border:2px solid var(--ink);box-shadow:none}
/* Konfetti på runde bursdager */
.milestone-glow{background-image:linear-gradient(rgba(242,238,229,.28),rgba(242,238,229,.28)),linear-gradient(to right,#BDDBCF 0.0% 3.704%,#74A491 3.704% 7.407%,#276337 7.407% 11.111%,#4E6B5C 11.111% 14.815%,#8A8B5C 14.815% 18.519%,#388A87 18.519% 22.222%,#394560 22.222% 25.926%,#4E7B8C 25.926% 29.63%,#87A7BC 29.63% 33.333%,#B0CBDD 33.333% 37.037%,#D7E4EA 37.037% 40.741%,#553C67 40.741% 44.444%,#8C5A74 44.444% 48.148%,#8B7A9E 48.148% 51.852%,#D2C4DE 51.852% 55.556%,#883A2B 55.556% 59.259%,#C64739 59.259% 62.963%,#C46E7E 62.963% 66.667%,#DE9273 66.667% 70.37%,#E7C5CB 70.37% 74.074%,#CC7F33 74.074% 77.778%,#E2C878 77.778% 81.481%,#C2AC85 81.481% 85.185%,#DFCBB9 85.185% 88.889%,#A88A6B 88.889% 92.593%,#9C6B3F 92.593% 96.296%,#6F4E37 96.296% 100.0%);background-repeat:no-repeat;background-size:100% 100%;background-attachment:fixed}
.pin-bg{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;overflow:auto;
  background-image:linear-gradient(rgba(242,238,229,.82),rgba(242,238,229,.82)),linear-gradient(to right,#BDDBCF 0.0% 3.704%,#74A491 3.704% 7.407%,#276337 7.407% 11.111%,#4E6B5C 11.111% 14.815%,#8A8B5C 14.815% 18.519%,#388A87 18.519% 22.222%,#394560 22.222% 25.926%,#4E7B8C 25.926% 29.63%,#87A7BC 29.63% 33.333%,#B0CBDD 33.333% 37.037%,#D7E4EA 37.037% 40.741%,#553C67 40.741% 44.444%,#8C5A74 44.444% 48.148%,#8B7A9E 48.148% 51.852%,#D2C4DE 51.852% 55.556%,#883A2B 55.556% 59.259%,#C64739 59.259% 62.963%,#C46E7E 62.963% 66.667%,#DE9273 66.667% 70.37%,#E7C5CB 70.37% 74.074%,#CC7F33 74.074% 77.778%,#E2C878 77.778% 81.481%,#C2AC85 81.481% 85.185%,#DFCBB9 85.185% 88.889%,#A88A6B 88.889% 92.593%,#9C6B3F 92.593% 96.296%,#6F4E37 96.296% 100.0%);
  background-repeat:no-repeat;background-size:100% 100%}
.confetti{position:relative;overflow:hidden}
.confetti i{position:absolute;top:-10px;width:5px;height:9px;border-radius:1px;opacity:.85;pointer-events:none;animation:cfall 2.8s linear infinite}
.shimmer{position:relative;overflow:hidden}
/* Kort respons når en rutine hakes av — g\u00e5r \u00e9n gang og gir seg selv */
.rutine-ok{position:relative;overflow:hidden}
.rutine-ok::after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:var(--ok-farge,var(--rose));opacity:0;animation:rutinepuls 1.1s ease-out 1}
@keyframes rutinepuls{0%{opacity:0}18%{opacity:.42}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.rutine-ok::after{animation:none;display:none}}
.shimmer::after{content:'';position:absolute;top:0;left:-60%;width:60%;height:100%;pointer-events:none;
  background:linear-gradient(75deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.65) 50%,rgba(255,255,255,0) 70%);
  animation:shimmersweep 3s ease-out infinite}
.starshower{position:relative;overflow:hidden}
.starshower i{position:absolute;top:-14px;font-style:normal;font-size:13px;opacity:0;pointer-events:none;animation:starfall 2.6s ease-in infinite}
@keyframes shimmersweep{0%{left:-60%}35%{left:120%}100%{left:120%}}
@keyframes starfall{0%{transform:translateY(-14px) rotate(0deg);opacity:0}12%{opacity:1}100%{transform:translateY(150px) rotate(70deg);opacity:0}}
@keyframes cfall{0%{transform:translateY(-12px) rotate(0deg)}100%{transform:translateY(52px) rotate(340deg)}}
@media (prefers-reduced-motion:reduce){.confetti i{animation:none;display:none}}
/* Spesialdager: bare selve banneret f\u00e5r farge og konfetti — resten av appen
   holder seg til det temaet brukeren har valgt. */
.spesialdag-banner{position:relative;overflow:hidden}
/* Jul og 17. mai f\u00e5rger hele appens bakgrunn denne dagen \u2014 bursdagen holder seg
   bevisst til banneret, som avtalt. */
body.spesialdag-bg-jul{--bg:#1F3D2B}
body.spesialdag-bg-17mai{--bg:#5B6E85}
.spesialdag-confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.spesialdag-confetti i{position:absolute;top:-14px;width:6px;height:11px;border-radius:1px;opacity:.88;
  animation-name:cfall;animation-timing-function:linear;animation-iteration-count:infinite;animation-duration:3.2s}
@media (prefers-reduced-motion:reduce){.spesialdag-confetti{display:none}}
@media (prefers-reduced-motion:reduce){.shimmer::after{animation:none;display:none}}
@media (prefers-reduced-motion:reduce){.starshower i{animation:none;display:none}}
.celeb{position:fixed;inset:0;z-index:3000;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.celeb-full{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.celeb-full i{position:absolute;top:-16px;width:8px;height:14px;border-radius:2px;opacity:.9;animation:cfallfull linear infinite}
@keyframes cfallfull{0%{transform:translateY(-20px) rotate(0deg)}100%{transform:translateY(105vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.celeb-full i{display:none}}
.celeb-body{position:relative;z-index:2;flex:1;overflow-y:auto;display:flex;flex-direction:column;justify-content:center;padding:28px 22px;text-align:center}
.celeb-nav{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:14px 20px 22px;gap:12px}
.celeb-dot{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block;margin:0 3px}
.celeb-dot.on{background:var(--title,var(--ink))}
.celeb-arrow{background:var(--card);border:1px solid var(--line);border-radius:50%;width:52px;height:52px;font-size:22px;color:var(--title,var(--ink));cursor:pointer;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.celeb-arrow:disabled{opacity:.3;cursor:default}
.round-bday{background:#FBF3DF}
/* Hurtiglogging på I dag */
.quick-log{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 12px 4px;padding:12px 14px}
.quick-log textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px;font-family:inherit;font-size:14px;resize:vertical;min-height:64px;color:var(--ink)}
.quick-log textarea:focus{outline:2px solid var(--sel-line)}
.catbox-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 12px}
.cat-box{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:10px;padding:5px 8px;min-width:0}
.cb-hd{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:1px}
.cb-item{display:block;width:100%;text-align:left;background:none;border:none;font-family:inherit;font-size:12px;line-height:1.3;color:var(--ink);padding:1px 0;cursor:pointer;border-radius:4px}
.cb-item .o{color:var(--rose)}
.kal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 12px}
.mm{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 6px;cursor:pointer;font-family:inherit;text-align:left;color:var(--ink)}
.mm-t{font-size:12px;font-weight:700;display:block;margin-bottom:4px;text-align:center}
.mm-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;font-size:8px;color:var(--muted)}
.mm-d{text-align:center;padding:0;line-height:1.3}
.mm-d.today{background:var(--sel);border-radius:3px;color:var(--ink);font-weight:700}
.mm-dots{display:flex;gap:1px;justify-content:center;height:3px}
.mm-dots i{width:3px;height:3px;border-radius:50%;display:inline-block}
.tag-pill{font-size:10px;color:var(--amber);background:#F5E8D8;padding:2px 7px;border-radius:99px}
button.tag-pill{border:none;font-family:inherit;line-height:inherit;cursor:pointer}
button.tag-pill:hover{filter:brightness(.94)}
.del-btn{font-size:12px;color:var(--red);background:none;border:none;cursor:pointer;padding:2px 4px;align-self:center;flex-shrink:0}
.empty{padding:18px;font-size:14px;color:var(--muted);line-height:1.7}
.hint-box{margin:12px 12px 0;padding:9px 14px;background:var(--red-soft);border-radius:10px;font-size:12px;color:var(--red)}

/* Rutinerad */
.chk{width:22px;height:22px;border-radius:6px;flex-shrink:0;margin-top:1px;border:2px solid var(--line);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent}
.chk.done{border-color:var(--done-line);background:var(--done);color:var(--red)}

/* Rutiner som knapper */
.rt-chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px}
.rt-btn{padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:13px;cursor:pointer;font-family:inherit;transition:background .1s}
.rt-btn.done{background:var(--done);border-color:var(--done-line);color:var(--ink);font-weight:600}

/* Linjert dagliste */
.daylist{padding:6px 10px 8px}
.dl-row{display:flex;align-items:baseline;gap:8px;padding:2px 4px;border-bottom:1px solid var(--line);min-height:19px;font-size:11px}
.dl-row:last-child{border-bottom:none}
.dl-row.wend{background:var(--bg)}
.dl-wk{width:16px;flex-shrink:0;color:var(--rose);font-size:9px;text-align:right}
.dl-date{width:42px;flex-shrink:0;color:var(--muted)}
.dl-row.today .dl-date,.dl-row.today .dl-wk{color:var(--red);font-weight:700}
.dl-evs{display:flex;flex-wrap:wrap;gap:4px;flex:1;min-width:0}
.dl-ev{font-size:11px;line-height:1.4;border:none;background:var(--sel);color:var(--ink);font-weight:600;border-radius:6px;padding:1px 8px;cursor:pointer;font-family:inherit;text-align:left}
.dl-ev.done{opacity:.4;text-decoration:line-through}

/* Komprimert kategorioversikt */
.freq-block{padding:8px 14px;border-bottom:1px solid var(--line)}
.freq-block:last-child{border-bottom:none}
.freq-main{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}

/* Oppsummering */
.cloud{padding:18px 14px;display:flex;flex-wrap:wrap;gap:12px 16px;align-items:baseline;justify-content:center}
.cloud.kompakt{padding:8px 10px;gap:1px 7px;line-height:1.05}
.cloud.kompakt .cloud-word{font-size:inherit}
.cloud-word{background:none;border:none;cursor:pointer;font-family:inherit;padding:0}
.cloud-word.lv1{color:var(--lv1);opacity:.75}
.cloud-word.lv2{color:var(--lv2)}
.cloud-word.lv3{color:var(--lv3)}
.cloud-word.lv4{color:var(--lv4)}
.cloud-word.lv5{color:var(--lv5)}
.cloud-word.lv6{color:var(--lv6);font-weight:700}
.cloud-word.lv7{color:var(--lv7);font-weight:800;letter-spacing:.01em}
.cloud-word.hot{font-weight:700}
.cloud-word.sel{color:var(--amber);font-weight:700;text-decoration:underline}
.freq-count{font-size:12px;color:var(--rose)}

/* FAB — brukes ikke, Nytt innlegg er i toppmenyen */

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.32);display:flex;align-items:flex-end;justify-content:center;z-index:200}
.modal{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:20px 18px 32px}
.modal-title{font-size:18px;font-weight:700;margin-bottom:16px}
.close-btn{float:right;background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted)}
.field-lbl{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;display:block;margin:16px 0 6px}
.inp{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);font-size:16px;background:var(--bg);color:var(--ink);font-family:inherit}
.inp:focus{outline:none;border-color:var(--red)}
textarea.inp{min-height:80px;resize:vertical}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{padding:6px 12px;border-radius:99px;font-size:13px;cursor:pointer;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit}
.chip.on{border-color:var(--sel-line);background:var(--sel);color:var(--ink);font-weight:700}
.chip-new{padding:6px 12px;border-radius:99px;font-size:13px;cursor:pointer;border:1.5px dashed var(--rose);background:transparent;color:var(--muted);font-family:inherit}
.save-btn{width:100%;margin-top:18px;padding:13px 0;border-radius:12px;border:none;background:var(--btn);color:var(--red);font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.save-btn:not(:disabled):active{background:var(--sel)}
.save-btn:disabled{background:#EDE7D8;color:var(--muted);cursor:default}
.del-full-btn{display:block;width:100%;margin-top:10px;padding:11px 0;border-radius:12px;border:1.5px solid var(--red);background:transparent;color:var(--red);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.step-back{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;margin-bottom:8px;display:block;font-family:inherit}
.hint{font-size:12px;color:var(--rose);margin-top:4px}
.add-btn{display:block;width:calc(100% - 24px);margin:10px 12px;padding:11px 0;border-radius:12px;border:1.5px dashed var(--rose);background:transparent;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}

function pad(n){return String(n).padStart(2,'0');}
function dow(d){return(new Date(d).getDay()+6)%7;}
// Dagens nøkkel for en daglig rutine — null hvis rutinen ikke gjelder i dag
// Mengde over tid for en daglig rutine — «11 av 14», uten rekker som kan brytes.
// Teller bare dagene rutinen faktisk gjaldt, så ukedagsbegrensning ikke gir falskt lav score.
function rutineMengde(r,dager){
  if(r.freq!=='daily')return null;
  dager=dager||14;
  var rd=r.days||[];
  var log=r.log||[];
  var gjort=0,mulige=0;
  for(var i=0;i<dager;i++){
    var d=new Date(today);d.setDate(d.getDate()-i);
    if(rd.length&&rd.indexOf(dow(d))<0)continue;
    mulige++;
    if(log.indexOf('d'+isoDate(d))>=0)gjort++;
  }
  return mulige?{gjort:gjort,mulige:mulige}:null;
}
function isoDate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fmtDate(s){var d=new Date(s+'T00:00:00');return d.getDate()+'. '+MND_FULL[d.getMonth()]+' '+d.getFullYear();}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
// Tekst som skal inn i en JS-streng inne i et HTML-attributt: escaper først
// backslash og apostrof for JS, deretter " og & for attributtet. Uten dette
// bryter navn som «5" rundpinne» eller «Kari "Mor"» hele onclick-attributtet.
function q(s){return esc(String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"));}
function nbSort(a,b){return a.localeCompare(b,'nb');}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}

function colorHexById(colId){var p=CAT_COLORS.find(function(x){return x.id===colId;});return p?p.hex:null;}

  if(c.color)return colorHexById(c.color);
  var m=c.parentId?catById(c.parentId):c;

function textOn(hex){
  if(!hex)return'#FDF7EC';
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  var lum=0.299*r+0.587*g+0.114*b;
  return lum>165?'#3B2E24':'#FDF7EC';
}

// Bytter ut et stikkord overalt det brukes. Er målet et stikkord som alt finnes,
// blir det en sammenslåing — og et innlegg som hadde begge, ender med ett.
function byttTagOveralt(fra,til){
  fra=tagId(fra);til=tagId(til);
  if(!fra||!til||fra===til)return 0;
  var antall=0;
  var bytt=function(liste){
    (liste||[]).forEach(function(x){
      if(!x.tags||!x.tags.length)return;
      var hadde=x.tags.map(tagId).indexOf(fra)>=0;
      if(!hadde)return;
      var nye=[];
      x.tags.forEach(function(t){
        var n=tagId(t)===fra?til:tagId(t);
        if(nye.indexOf(n)<0)nye.push(n); // hindrer duplikat når begge fantes
      });
      x.tags=nye;antall++;
    });
  };
  bytt(entries);bytt(events);bytt(routines);bytt(inventories);bytt(results);
  // Kategoritilknytningen følger med, med mindre målet alt har en
  if(tagCats[fra]&&!tagCats[til])tagCats[til]=tagCats[fra];
  delete tagCats[fra];
  return antall;
}

// Original seiersfanfare — syntetisert, ingen lydfiler. Stigende treklang som lander
// på oktaven, med en varm messinglignende klang (sagtann + mykt filter).
var _audioCtx=null;
function audioCtx(){
  if(!_audioCtx){
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return null;
    _audioCtx=new AC();
  }
  if(_audioCtx.state==='suspended')_audioCtx.resume();
  return _audioCtx;
}
function playTone(ctx,freq,startAt,dur,gainPeak){
  var osc=ctx.createOscillator(),gain=ctx.createGain(),filt=ctx.createBiquadFilter();
  osc.type='sawtooth';
  osc.frequency.setValueAtTime(freq,startAt);
  filt.type='lowpass';
  filt.frequency.setValueAtTime(2200,startAt);
  filt.Q.setValueAtTime(0.7,startAt);
  gain.gain.setValueAtTime(0.0001,startAt);
  gain.gain.exponentialRampToValueAtTime(gainPeak,startAt+0.035);
  gain.gain.exponentialRampToValueAtTime(0.0001,startAt+dur);
  osc.connect(filt);filt.connect(gain);gain.connect(ctx.destination);
  osc.start(startAt);osc.stop(startAt+dur+0.05);
}
function playFanfare(){
  if(!soundOn)return;
  var ctx=audioCtx();if(!ctx)return;
  var t=ctx.currentTime+0.03;
  // C – E – G – C: klassisk oppadgående figur, siste tone holdes lenger
  var notes=[[523.25,0.00,0.20],[659.25,0.13,0.20],[783.99,0.26,0.22],[1046.50,0.42,0.85]];
  notes.forEach(function(n,i){
    playTone(ctx,n[0],t+n[1],n[2],i===3?0.22:0.16);
    // Oktav under gir fylde uten å bli skarpt
    playTone(ctx,n[0]/2,t+n[1],n[2],i===3?0.10:0.07);
  });
  // Kvinten legges til på sluttakkorden så den klinger som en akkord, ikke en enkelttone
  playTone(ctx,1567.98,t+0.42,0.80,0.07);
}

// Enkel, selvtegnet linjegraf i SVG — ingen eksterne biblioteker. Tegner fra første
// måling, og viser hver referansebane som en stiplet linje med etikett.
function maalingGrafSVG(serie){
  var pts=(serie.punkter||[]).slice().sort(function(a,b){return a.dato<b.dato?-1:1;});
  if(!pts.length)return'<div class="empty">Ingen m\u00e5linger enn\u00e5.</div>';
  var refs=serie.referanser||[];
  var alle=pts.map(function(p){return Number(p.verdi);}).concat(refs.map(function(r){return Number(r.verdi);}));
  var minV=Math.min.apply(null,alle),maxV=Math.max.apply(null,alle);
  if(minV===maxV){minV-=1;maxV+=1;}
  var pad=(maxV-minV)*0.15;var visMin=minV,visMax=maxV;minV-=pad;maxV+=pad;
  var W=320,H=130,ML=8,MR=30,MT=10,MB=18,plotW=W-ML-MR,plotH=H-MT-MB;
  // X-aksen f\u00f8lger faktisk tid mellom m\u00e5lingene — to m\u00e5linger med \u00e9n ukes mellomrom
  // st\u00e5r n\u00e6rmere hverandre enn to med \u00e9n m\u00e5neds mellomrom, i stedet for at alle
  // punktene bare fordeles jevnt uansett hvor langt fra hverandre de faktisk er.
  var t0=new Date(pts[0].dato+'T00:00:00').getTime();
  var tN=new Date(pts[pts.length-1].dato+'T00:00:00').getTime();
  var span=tN-t0;
  var xFor=function(p){
    if(!span)return ML+plotW/2;
    return ML+plotW*((new Date(p.dato+'T00:00:00').getTime()-t0)/span);
  };
  var yFor=function(v){return MT+plotH-(v-minV)/(maxV-minV)*plotH;};
  var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:130px;display:block">';
  refs.forEach(function(r){
    var y=yFor(Number(r.verdi));
    svg+='<line x1="'+ML+'" y1="'+y+'" x2="'+(W-MR)+'" y2="'+y+'" style="stroke:var(--rose);stroke-width:1;stroke-dasharray:4 3"/>'
      +'<text x="'+(W-MR-3)+'" y="'+(y-3)+'" style="font-size:8px;fill:var(--muted)" text-anchor="end">'+esc(r.navn?r.navn+' '+r.verdi:String(r.verdi))+'</text>';
  });
  if(pts.length>1){
    var linje=pts.map(function(p){return xFor(p)+','+yFor(Number(p.verdi));}).join(' ');
    svg+='<polyline points="'+linje+'" style="fill:none;stroke:var(--ink);stroke-width:2"/>';
  }
  pts.forEach(function(p){
    svg+='<circle cx="'+xFor(p)+'" cy="'+yFor(Number(p.verdi))+'" r="3.5" style="fill:var(--rose)"/>';
  });
  // Tallmerker langs vertikal akse, p\u00e5 h\u00f8yre side — laveste, midterste og h\u00f8yeste verdi
  var fmtTall=function(v){return String(Math.round(v*10)/10).replace('.',',');};
  [visMin,(visMin+visMax)/2,visMax].forEach(function(v){
    svg+='<text x="'+(W-2)+'" y="'+(yFor(v)+3)+'" text-anchor="end" style="font-size:8px;fill:var(--muted)">'+esc(fmtTall(v))+'</text>';
  });
  var f0=pts[0],fN=pts[pts.length-1];
  svg+='<text x="'+ML+'" y="'+(H-4)+'" style="font-size:8px;fill:var(--muted)">'+esc(fmtDate(f0.dato))+'</text>';
  if(pts.length>1)svg+='<text x="'+(W-MR)+'" y="'+(H-4)+'" style="font-size:8px;fill:var(--muted)" text-anchor="end">'+esc(fmtDate(fN.dato))+'</text>';
  svg+='</svg>';
  return svg;
}

// ── Garnmatching: hvilke oppskrifter dekkes av garnet i lageret? ──
function garnGrams(it){
  var v=(it&&it.values)||{};
  var q=Number(v.__qty)||0;if(!q)return 0;
  var u=(v.__unit||'').toLowerCase();
  if(u==='g')return q;
  var gpn=Number(v.__gramPerNoste)||0;
  if(u==='n\u00f8ster')return gpn?q*gpn:0;
  return 0;
}
function garnKey(it){
  var v=it.values||{};
  return{
    navn:(v.__garnnavn||'').trim().toLowerCase(),
    type:(v.__garntype||'').trim().toLowerCase(),
    fiber:(v.__fiber||'').trim().toLowerCase(),
    lev:(v.__leverandor||'').trim()
  };
}
// Treff på navn er sikrest. Ellers holder det at både type og fiber stemmer.
function garnMatch(a,b){
  if(a.navn&&b.navn&&a.navn===b.navn)return'navn';
  if(a.type&&b.type&&a.type===b.type&&a.fiber&&b.fiber&&a.fiber===b.fiber)return'type';
  return null;
}
function garnStashItems(){var l=findFixedList('garnlager');return l?(l.items||[]):[];}
function oppskriftItems(){var l=findFixedList('strikkeoppskrifter');return l?(l.items||[]):[];}
// For én oppskrift: hvor mye passende garn finnes, og hvilke poser er det?
function oppskriftNeed(op,sz){
  var v=op.values||{};
  var q=Number(v['__qty'+sz]);
  if(!q)return 0;
  return garnGrams({values:{__qty:String(q),__unit:v.__unit,__gramPerNoste:v.__gramPerNoste}});
}
function oppskriftSizes(op){
  return STORRELSER.filter(function(sz){return oppskriftNeed(op,sz)>0;});
}
function garnForOppskrift(op,sz){
  var need=sz?oppskriftNeed(op,sz):garnGrams(op);
  var k=garnKey(op);
  var hits=[];var have=0;var unknown=false;
  garnStashItems().forEach(function(g){
    var basis=garnMatch(k,garnKey(g));
    if(!basis)return;
    var gr=garnGrams(g);
    if(!gr)unknown=true;
    have+=gr;
    hits.push({item:g,grams:gr,basis:basis});
  });
  return{need:need,have:have,hits:hits,unknown:unknown,
    enough:need>0&&have>=need,short:need>0&&have<need?need-have:0};
}
// For ett garn: hvilke oppskrifter kan det brukes til?
function oppskrifterForGarn(g){
  var k=garnKey(g);
  return oppskriftItems().filter(function(op){return!!garnMatch(k,garnKey(op));});
}
// Fargene på garnposene som matcher oppskriften — det brukeren faktisk trenger å vite
function garnFargerTxt(hits){
  var f=hits.map(function(h){return((h.item.values||{}).__farge||'').trim();}).filter(Boolean);
  f=f.filter(function(v,i,a){return a.indexOf(v)===i;});
  return f.length?' \u00b7 '+f.map(esc).join(', '):'';
}
function garnStatusHTML(op){
  var sizes=oppskriftSizes(op);
  if(sizes.length){
    var any=garnForOppskrift(op,sizes[0]);
    if(!any.hits.length)return'<span style="color:var(--muted)">ingen passende garn i lageret</span>';
    var fTxt=garnFargerTxt(any.hits);
    return sizes.map(function(sz){
      var rr=garnForOppskrift(op,sz);
      if(rr.enough)return'<span style="color:var(--red);font-weight:700">'+sz+' \u2713</span>';
      if(rr.unknown)return'<span style="color:var(--amber)">'+sz+' ?</span>';
      return'<span style="color:var(--amber)">'+sz+' \u2212'+rr.short+' g</span>';
    }).join(' \u00b7 ')+' <span style="color:var(--muted)">(har '+any.have+' g'+fTxt+')</span>';
  }
  var r=garnForOppskrift(op);
  if(!r.hits.length)return'<span style="color:var(--muted)">ingen passende garn i lageret</span>';
  fTxt=garnFargerTxt(r.hits);
  if(!r.need)return'<span style="color:var(--muted)">'+r.have+' g passende garn'+fTxt+' \u2014 oppskriften mangler mengde</span>';
  if(r.unknown&&!r.enough)return'<span style="color:var(--amber)">'+r.have+' av '+r.need+' g'+fTxt+' \u2014 noe garn mangler gram per n\u00f8ste</span>';
  if(r.enough)return'<span style="color:var(--red);font-weight:700">\u2713 nok garn \u00b7 '+r.have+' av '+r.need+' g</span><span style="color:var(--muted)">'+fTxt+'</span>';
  return'<span style="color:var(--amber)">mangler '+r.short+' g \u00b7 har '+r.have+' av '+r.need+' g'+fTxt+'</span>';
}

function garnmatchViewHTML(){
  var h='<div style="padding:14px 12px 0"><button class="icon-btn" onclick="goBack()">\u2039</button></div>'
    +'<div class="view-title">Hva kan jeg strikke n\u00e5?</div>'
    +'<div class="view-sub">Sammenligner garnet i lageret med oppskriftene dine. Treff p\u00e5 garnnavn, eller p\u00e5 type og fiber.</div>';
  var ops=oppskriftItems();
  if(!ops.length)return h+'<div class="card"><div class="empty">Ingen oppskrifter enn\u00e5.</div></div>';
  var rows=ops.map(function(op){return{op:op,r:garnForOppskrift(op)};});
  var rank=function(x){
    var szs=oppskriftSizes(x.op);
    if(szs.length){
      if(!x.r.hits.length)return 2;
      return szs.some(function(sz){return garnForOppskrift(x.op,sz).enough;})?0:1;
    }
    return x.r.enough?0:x.r.hits.length?1:2;
  };
  rows.sort(function(a,b){return rank(a)-rank(b)||nbSort(a.op.name,b.op.name);});
  var groups=[[0,'Nok garn til minst \u00e9n st\u00f8rrelse'],[1,'Mangler litt'],[2,'Ingen match']];
  groups.forEach(function(gr){
    var sub=rows.filter(function(x){return rank(x)===gr[0];});
    if(!sub.length)return;
    h+='<div class="sec-title">'+gr[1]+'</div><div class="card">';
    sub.forEach(function(x){
      h+='<div class="entry-row"><div class="entry-body">'
        +'<div class="entry-text">'+esc(x.op.name)+'</div>'
        +'<div class="entry-date">'+garnStatusHTML(x.op)+'</div>'
        +(x.r.hits.length?'<div class="entry-date" style="color:var(--muted)">'
            +x.r.hits.map(function(hh){return esc(hh.item.name)+(hh.grams?' ('+hh.grams+' g)':'');}).join(' \u00b7 ')

        +'</div></div>';
    });
    h+='</div>';
  });
  return h;
}

// Flytter et punkt opp/ned blant de andre i SAMME underkategori — resten av
// den globale lista (andre kategoriers punkter) ligger urørt mellom dem.
function investFlytt(id,retning){
  var i=investeringer.findIndex(function(x){return x.id===id;});
  if(i<0)return;
  var catId=investeringer[i].catId;
  var j=i+retning;
  while(j>=0&&j<investeringer.length&&investeringer[j].catId!==catId)j+=retning;
  if(j<0||j>=investeringer.length)return;
  var tmp=investeringer[i];investeringer[i]=investeringer[j];investeringer[j]=tmp;
  save();render();
}

// Global prioritering på Økonomisiden — én flat liste på tvers av kategorier.
// Regelen: to punkter fra ULIKE kategorier kan alltid bytte plass her. To punkter
// fra SAMME kategori kan aldri bytte plass her — den rekkefølgen styres bare på
// kategoriens egen side. Endres den der, reparerer investGlobalListe() seg selv
// automatisk neste gang den leses, uten å miste hvor i den globale lista de ligger.
function investGlobalListe(){
  var alle=investeringer.map(function(x){return x.id;});
  investGlobalOrder=investGlobalOrder.filter(function(id){return alle.indexOf(id)>=0;});
  alle.forEach(function(id){if(investGlobalOrder.indexOf(id)<0)investGlobalOrder.push(id);});
  var posisjonerPerKat={};
  investGlobalOrder.forEach(function(id,i){
    var it=investeringer.find(function(x){return x.id===id;});
    if(!it)return;
    (posisjonerPerKat[it.catId]=posisjonerPerKat[it.catId]||[]).push(i);
  });
  Object.keys(posisjonerPerKat).forEach(function(catId){
    var posisjoner=posisjonerPerKat[catId];
    var lokal=investeringerForKat(catId).map(function(x){return x.id;});
    posisjoner.forEach(function(pos,k){investGlobalOrder[pos]=lokal[k];});
  });
  return investGlobalOrder.map(function(id){return investeringer.find(function(x){return x.id===id;});}).filter(Boolean);
}
function investGlobalFlytt(id,retning){
  investGlobalListe(); // sikrer full, reparert liste f\u00f8r vi flytter noe i den
  var i=investGlobalOrder.indexOf(id);
  if(i<0)return;
  var j=i+retning;
  if(j<0||j>=investGlobalOrder.length)return;
  var mitt=investeringer.find(function(x){return x.id===id;});
  var nabo=investeringer.find(function(x){return x.id===investGlobalOrder[j];});
  if(!mitt||!nabo||mitt.catId===nabo.catId)return; // samme kategori — styres p\u00e5 kategorisiden
  var tmp=investGlobalOrder[i];investGlobalOrder[i]=investGlobalOrder[j];investGlobalOrder[j]=tmp;
  save();render();
}
function investeringerAltHTML(){
  var liste=investGlobalListe();
  var h='';
  if(!liste.length){
    h+='<div class="empty" style="padding:6px 12px">Ingen planlagte investeringer registrert enn\u00e5, i noen kategori.</div>';
  } else {
    h+=liste.map(function(it,i){
      var uc=cats.find(function(c){return c.id===it.catId;});
      var hoved=uc?cats.find(function(c){return c.id===uc.parentId;}):null;
      var col=hoved?(catColor(hoved.id)||'var(--line)'):'var(--line)';
      var naboOpp=i>0?investeringer.find(function(x){return x.id===investGlobalOrder[i-1];}):null;
      var naboNed=i<liste.length-1?investeringer.find(function(x){return x.id===investGlobalOrder[i+1];}):null;
      var kanOpp=naboOpp&&naboOpp.catId!==it.catId;
      var kanNed=naboNed&&naboNed.catId!==it.catId;
      return'<div class="entry-row" style="align-items:flex-start;cursor:pointer;border-left:3px solid '+col+'" onclick="openEditInvestering(\''+q(it.id)+'\')">'
        +'<span style="flex-shrink:0;font-weight:700;color:var(--rose);width:18px">'+(i+1)+'.</span>'
        +'<div class="entry-body"><div class="entry-text">'+esc(it.tittel)+(hoved?' <span style="font-weight:400;color:var(--muted)">('+esc(hoved.name)+')</span>':'')+'</div>'
        +(it.kostnad?'<div class="entry-date">ca. '+fmtKr(it.kostnad)+'</div>':'')+'</div>'
        +'<div style="display:flex;flex-direction:column;gap:2px;flex-shrink:0" onclick="event.stopPropagation()">'
        +(kanOpp?'<button class="icon-btn" style="font-size:10px;padding:0 5px" onclick="investGlobalFlytt(\''+q(it.id)+'\',-1)">\u2191</button>':'')
        +(kanNed?'<button class="icon-btn" style="font-size:10px;padding:0 5px" onclick="investGlobalFlytt(\''+q(it.id)+'\',1)">\u2193</button>':'')
        +'</div></div>';
    }).join('');
  }
  h+='<div style="padding:6px 12px 4px"><button class="icon-btn" style="font-size:11px" onclick="openInvesteringModal(\''+q(katVedNavn('\u00f8konomi')?investeringerUnderkatId(katVedNavn('\u00f8konomi').id):'')+'\')">+ Legg til investering under \u00d8konomi</button></div>';
  return h;
}
function investeringerUnderkatId(hovedId){
  var uc=cats.find(function(c){return c.parentId===hovedId&&(c.name||'').toLowerCase()==='planlagte investeringer';});
  return uc?uc.id:'';
}
function katVedNavn(navn){
  return cats.filter(function(c){return!c.parentId;}).find(function(c){
    return(c.name||'').trim().toLowerCase()===navn;
  })||null;
}
// Kategorisidene får kategoriens egen farge som bakgrunn, sterkt uttynnet
// så teksten fortsatt er lett å lese
function katSideStart(cat){
  var col=cat?catColor(cat.id):null;
  var bg=col?lightHex(col,0.86):'';
  return'<div style="min-height:100%'+(bg?';background:'+bg:'')+'">';
}
function katSideSlutt(){return'</div>';}
function folkCat(){return katVedNavn('folk');}
function catIdsUnder(cat){
  if(!cat)return [];
  return [cat.id].concat(cats.filter(function(c){return c.parentId===cat.id;}).map(function(c){return c.id;}));
}
// Samler alt appen vet om en gruppe: hvem som er med, bursdagene deres,

// Bursdagsbolken på Folk: de nærmeste fjorten dagene. Oversikt og gavelogg
// har egne knapper over kortet, så bolken trenger ikke lenger å veksle.
function bdayBolkHTML(soon){
  if(!soon.length)return'<div class="empty">Ingen de neste fjorten dagene.</div>';
  return soon.map(function(e){
    var d=daysToNextBday(e);
    var nAge=bdayNextAge(e);
    var round=isRoundBdayNext(e);
    return'<div class="entry-row'+(round?' confetti round-bday':'')+'" style="position:relative;cursor:pointer;align-items:center" onclick="goGavePerson(\''+q(e.name)+'\')">'
      +(round?confettiHTML():'')
      +'<span style="flex-shrink:0;display:flex;align-items:center">'+personBallongSVG(e.name,34)+'</span>'
      +'<div class="entry-body"><div class="entry-text" style="font-size:13px">'+esc(e.name)
      +(nAge?' fyller '+nAge:'')+'</div>'
      +'<div class="entry-date">'+(d===0?'i dag!':d===1?'i morgen':'om '+d+' dager')+'</div></div></div>';
  }).join('');
}
function folkViewHTML(){
  var cat=folkCat();
  var h=katSideStart(cat)+'<div class="view-title">Folk</div>';
  if(!cat){
    return h+'<div class="card"><div class="empty">Denne siden viser alt som h\u00f8rer til hovedkategorien \u00abFolk\u00bb. Opprett en hovedkategori med det navnet under Administrer for \u00e5 ta den i bruk.</div></div>'+katSideSlutt();
  }
  var ids=catIdsUnder(cat);
  var inCat=function(list){return(list||[]).some(function(c){return ids.indexOf(c)>=0;});};
  var bdays=events.filter(function(e){return e.bday;});

  // Grunnverdien som gir kategorien retning
  var gs=goals.filter(function(g){return inCat(g.cats);});
  if(gs.length){
    h+='<div class="card" style="border-left:4px solid '+(catColor(cat.id)||'var(--rose)')+'">';
    gs.forEach(function(g){
      h+='<div style="padding:10px 14px"><div style="font-size:15px;font-weight:800">'+esc(g.name)+'</div>'
        +(g.text?'<div style="font-size:13px;color:var(--muted);margin-top:3px">'+esc(g.text)+'</div>':'')+'</div>';
    });
    h+='</div>';
  }

  // Ordskya for kategorien
  var counts={};
  Object.keys(tagCats).forEach(function(t){if(ids.indexOf(tagCats[t])>=0)counts[t]=0;});
  entries.forEach(function(e){(e.tags||[]).forEach(function(t){if(counts.hasOwnProperty(t))counts[t]++;});});
  var sky=cloudSectionHTML(counts,true,'folk','Ti på topp',true);
  if(sky)h+=sky;

  // Bursdager og planer side om side
  var soon=bdays.filter(function(e){
    if(erMinne(e))return false;
    var d=daysToNextBday(e);
    return d>=0&&d<=14;
  }).sort(function(a,b){return daysToNextBday(a)-daysToNextBday(b);});
  var minner=bdays.filter(function(e){
    if(!erMinne(e))return false;
    var d=daysToNextBday(e);
    return d>=0&&d<=30;
  }).sort(function(a,b){return daysToNextBday(a)-daysToNextBday(b);});
  // Bare planer som ligger foran oss — gjentakende regnes alltid som kommende
  var iToday=isoDate(today);
  var planDato=function(e){
    var y=e.repeat?(((e.month*100+(e.day||31))<(curMonth*100+today.getDate()))?curYear+1:curYear):e.year;
    return y+'-'+pad(e.month)+'-'+pad(e.day||1);
  };
  var underIdsFolk=cats.filter(function(c){return c.parentId===cat.id;}).map(function(c){return c.id;});
  // Alle planer vises her — også de med underkategori, gruppert etter den
  var evs=events.filter(function(e){
    if(e.bday||!inCat(e.cats))return false;
    if(e.repeat)return true;
    return planDato(e)>=iToday;
  }).sort(function(a,b){return planDato(a)<planDato(b)?-1:1;});
  var underFolk=cats.filter(function(c){return c.parentId===cat.id;}).sort(function(a,b){return nbSort(a.name,b.name);});
  var planRad=function(e){
    return'<div class="entry-row" style="cursor:pointer" onclick="openEditEvent(\''+q(e.id)+'\')">'
      +'<div class="entry-body"><div class="entry-text" style="font-size:13px">'+esc(e.name)+'</div>'
      +'<div class="entry-date">'+(e.day?e.day+'. ':'')+MND_FULL[e.month-1]+(e.repeat?' hvert \u00e5r':' '+e.year)+'</div></div></div>';
  };
  var planGruppeHdr=function(navn){
    return'<div style="padding:6px 14px 2px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--grp)">'+esc(navn)+'</div>';
  };
  var planerHTML=function(){
    if(!evs.length)return'<div class="empty">Ingen planer framover.</div>';
    var ut='';
    // Først de uten underkategori, så én gruppe per underkategori
    var utenUnder=evs.filter(function(e){return!(e.cats||[]).some(function(cid){return underIdsFolk.indexOf(cid)>=0;});});
    if(utenUnder.length)ut+=utenUnder.map(planRad).join('');
    underFolk.forEach(function(uc){
      var mine=evs.filter(function(e){return(e.cats||[]).indexOf(uc.id)>=0;});
      if(!mine.length)return;
      ut+=planGruppeHdr(uc.name)+mine.map(planRad).join('');
    });
    return ut;
  };

  h+='<div style="display:flex;gap:8px;align-items:flex-start;padding:0 4px">';
  h+='<div style="flex:1;min-width:0">'
    +'<div class="sec-title">Bursdager</div>'
    +'<div class="chips" style="padding:2px 0 4px">'
    +'<button class="chip" style="font-size:11px" onclick="goBursdagsliste()">Bursdagsliste</button>'
    +'<button class="chip" style="font-size:11px" onclick="goGaver()">Gavelogg</button>'
    +'</div>'
    +'<div class="card">'+bdayBolkHTML(soon)+'</div>'
    +'</div>';
  h+='<div style="flex:1;min-width:0">'
    +'<div class="sec-title">Planer med folk</div>'
    +'<div class="card">'+planerHTML()+'</div>'
    +'<div style="padding:6px 0 0"><button class="icon-btn" style="font-size:11px" onclick="nyFolkPlan()">+ Ny plan</button></div>'
    +'</div>';
  h+='</div>';

  if(minner.length){
    h+='<div class="sec-title">Minnebursdager <span style="font-weight:400;color:var(--rose)">\u00b7 neste m\u00e5ned</span></div><div class="card">'
      +minner.map(function(e){
        var d=daysToNextBday(e);
        return'<div class="entry-row" style="cursor:pointer" onclick="goGavePerson(\''+q(e.name)+'\')">'
          +'<div class="entry-body"><div class="entry-text" style="font-size:13px">'+esc(e.name)+'</div>'
          +'<div class="entry-date">'+(e.day?e.day+'. ':'')+MND_FULL[e.month-1]
          +' \u00b7 '+(d===0?'i dag':d===1?'i morgen':'om '+d+' dager')+'</div></div></div>';
      }).join('')+'</div>';
  }

  h+='<div style="padding:2px 12px 0"><button class="icon-btn" style="font-size:11px" onclick="nyKatProsjekt(\''+q(cat.id)+'\')">+ Nytt prosjekt</button> '
    +'<button class="icon-btn" style="font-size:11px" onclick="nyKatRutine(\''+q(cat.id)+'\')">+ Ny rutine</button> '
    +'<button class="icon-btn" style="font-size:11px" onclick="nyKatHendelse(\''+q(cat.id)+'\')">+ Ny plan</button> '
    +'<button class="icon-btn" style="font-size:11px" onclick="nyKatListe(\''+q(cat.id)+'\')">+ Ny liste</button></div>';

  // Underkategorier som egne bokser — samme mønster som de andre kategorisidene
  h+=katUnderBokserHTML(cat,[],{});

  // Rutiner nederst, som på de andre kategorisidene
  var underIdsF=cats.filter(function(c){return c.parentId===cat.id;}).map(function(c){return c.id;});
  var rtsF=routines.filter(function(r){
    return(r.cats||[]).some(function(cid){return ids.indexOf(cid)>=0;})
      &&!(r.cats||[]).some(function(cid){return underIdsF.indexOf(cid)>=0;});
  }).sort(function(a,b){return nbSort(a.name,b.name);});
  h+=katRutineKnapperHTML(ids,rtsF);

  return h+katSideSlutt();
}
// Generisk kategoriside — grunnverdi, ordsky, og det kategorien inneholder.
// Som Folk og Kreativitet eier den ingenting; alt vises fra der det bor.
// Rutiner som knapper — daglige hver dag, ukentlige fra mandag, månedlige fra den 1.,
// årlige fra 1. januar. Blir stående ut perioden så du kan ta dem igjen senere.
function katRutineKnapperHTML(ids,rts){
  var mine=routines.filter(function(r){return(r.cats||[]).some(function(c){return ids.indexOf(c)>=0;});});
  if(!mine.length)return'';
  var wKey='w'+weekYear(today)+'-'+pad(weekNum(today));
  var ymKey=curYear+'-'+pad(curMonth);
  var grupper=[
    {tit:'I dag',liste:[]},
    {tit:'Denne uka',liste:[]},
    {tit:'Denne m\u00e5neden',liste:[]},
    {tit:'I \u00e5r',liste:[]}
  ];
  mine.forEach(function(r){
    // Rutiner som bare gjelder visse m\u00e5neder, skal ikke dukke opp utenom
    if(r.months&&r.months.length&&r.months.indexOf(curMonth)<0)return;
    var f=r.freq||'monthly';
    if(f==='daily'){
      var rd=r.days||[];
      if(rd.length&&rd.indexOf(dow(today))<0)return;
      grupper[0].liste.push({r:r,key:'d'+isoDate(today)});
    } else if(f==='weekly'||f==='odd'||f==='even'){
      var wk=weekNum(today);
      if(f==='odd'&&wk%2===0)return;
      if(f==='even'&&wk%2===1)return;
      grupper[1].liste.push({r:r,key:wKey});
    } else if(f==='yearly'){
      grupper[3].liste.push({r:r,key:'y'+curYear});
    } else {
      grupper[2].liste.push({r:r,key:'m'+ymKey});
    }
  });
  var h='';
  grupper.forEach(function(g){
    if(!g.liste.length)return;
    h+='<div style="padding:6px 12px 2px;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--grp)">'+g.tit+'</div>'
      +'<div class="chips" style="padding:0 12px 4px">'
      +g.liste.sort(function(a,b){return nbSort(a.r.name,b.r.name);}).map(function(x){
        var gjort=(x.r.log||[]).indexOf(x.key)>=0;
        var nettopp=recentDone['r_'+x.r.id+'_'+x.key];
        var col=catColor(mainCatOf(x.r.cats));
        return'<button class="chip'+(gjort?' on':'')+(nettopp?' rutine-ok':'')+'"'
          +(nettopp&&col?' style="--ok-farge:'+col+'"':'')
          +' onclick="boxToggleRoutine(\''+q(x.r.id)+'\',\''+q(x.key)+'\')">'
          +(gjort?'\u2713 ':'')+esc(x.r.name)+'</button>';
      }).join('')
      +'</div>';
  });
  // Redigeringslista lå før i en egen bolk «Rediger rutiner». Den hører hjemme
  // her, i samme kort: hak av øverst, endre nederst.
  var red='';
  if(rts&&rts.length){
    red='<div style="padding:8px 12px 2px;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--grp);border-top:1px solid var(--line);margin-top:4px">Endre</div>'
      +rts.map(function(r){
        var m=rutineMengde(r);
        return'<div class="entry-row tett" style="cursor:pointer;border-bottom:none" onclick="openEditRoutine(\''+q(r.id)+'\')">'
          +'<div class="entry-body"><div class="entry-text">'+esc(r.name)+rutineStjerneHTML(r)+'</div>'
          +'<div class="entry-date">'+esc(freqShort(r))
          +(m?' \u00b7 '+m.gjort+' av '+m.mulige+' siste to uker':'')+'</div></div>'
          +'<span style="align-self:center;color:var(--rose)">\u203a</span></div>';
      }).join('');
  }
  if(!h&&!red)return'';
  return'<div class="sec-title">Rutiner'+(h?' <span style="font-weight:400;color:var(--rose)">\u00b7 trykk n\u00e5r gjort</span>':'')+'</div>'
    +'<div class="card" style="padding:4px 0 8px">'+h+red+'</div>';
}
function katSideHTML(navn, tittel, skyNokkel, ekstra){
  var cat=katVedNavn(navn);
  var h=katSideStart(cat)+'<div class="view-title">'+esc(tittel)+'</div>';
  if(!cat){
    return h+'<div class="card"><div class="empty">Denne siden viser alt som h\u00f8rer til hovedkategorien \u00ab'+esc(tittel)+'\u00bb. Opprett en hovedkategori med det navnet under Administrer for \u00e5 ta den i bruk.</div></div>'+katSideSlutt();
  }
  var ids=catIdsUnder(cat);
  var inCat=function(list){return(list||[]).some(function(c){return ids.indexOf(c)>=0;});};

  var gs=goals.filter(function(g){return inCat(g.cats);});
  if(gs.length){
    h+='<div class="card" style="border-left:4px solid '+(catColor(cat.id)||'var(--rose)')+'">';
    gs.forEach(function(g){
      h+='<div style="padding:10px 14px"><div style="font-size:15px;font-weight:800">'+esc(g.name)+'</div>'
        +(g.text?'<div style="font-size:13px;color:var(--muted);margin-top:3px">'+esc(g.text)+'</div>':'')+'</div>';
    });
    h+='</div>';
  }

  var counts={};
  Object.keys(tagCats).forEach(function(t){if(ids.indexOf(tagCats[t])>=0)counts[t]=0;});
  entries.forEach(function(e){(e.tags||[]).forEach(function(t){if(counts.hasOwnProperty(t))counts[t]++;});});
  var sky=cloudSectionHTML(counts,true,skyNokkel,'Ti på topp',true);

  // Kommende hendelser — de nærmeste vises ved siden av ordskya
  var iToday=isoDate(today);
  var alleEvs=events.filter(function(e){
    if(e.bday||!inCat(e.cats))return false;
    if(e.repeat)return true;
    // Mangler dagen, teller hendelsen som kommende ut hele måneden
    var sisteDag=e.day||new Date(e.year,e.month,0).getDate();
    return(e.year+'-'+pad(e.month)+'-'+pad(sisteDag))>=iToday;
  }).sort(function(a,b){return(a.year*10000+a.month*100+(a.day||0))-(b.year*10000+b.month*100+(b.day||0));});
  var naere=alleEvs.slice(0,3);
  var naereIds={};naere.forEach(function(e){naereIds[e.id]=1;});
  var evRad=function(e){
    return'<div class="entry-row" style="cursor:pointer" onclick="openEditEvent(\''+q(e.id)+'\')">'
      +'<div class="entry-body"><div class="entry-text" style="font-size:12.5px">'+esc(e.name)+'</div>'
      +'<div class="entry-date">'+(e.day?e.day+'. ':'')+MND_FULL[e.month-1]+(e.repeat?' hvert \u00e5r':' '+e.year)+'</div></div></div>';
  };
  h+='<div style="display:flex;gap:8px;align-items:flex-start;padding:0 4px">'
    +'<div style="flex:1;min-width:0">'+(sky||'<div class="sec-title">Stikkord</div><div class="card"><div class="empty">Ingen enn\u00e5.</div></div>')+'</div>'
    +'<div style="flex:1;min-width:0">'
      +'<div class="sec-title">Kommende</div>'
      +'<div class="card">'+(naere.length?naere.map(evRad).join(''):'<div class="empty">Ingen planer framover.</div>')+'</div>'
    +'</div>'
    +'</div>';
  // Gantt for prosjektene i denne kategorien
  var katRader=ganttRows().filter(function(rad){
    return(rad.cats||[]).some(function(cid){return ids.indexOf(cid)>=0;});
  });
  if(katRader.length)h+=ganttHTML(katRader,'Prosjektene i tid');

  if(ekstra)h+=ekstra;

  h+='<div style="padding:2px 12px 0"><button class="icon-btn" style="font-size:11px" onclick="nyKatProsjekt(\''+q(cat.id)+'\')">+ Nytt prosjekt</button> '
    +'<button class="icon-btn" style="font-size:11px" onclick="nyKatRutine(\''+q(cat.id)+'\')">+ Ny rutine</button> '
    +'<button class="icon-btn" style="font-size:11px" onclick="nyKatHendelse(\''+q(cat.id)+'\')">+ Ny plan</button> '
    +'<button class="icon-btn" style="font-size:11px" onclick="nyKatListe(\''+q(cat.id)+'\')">+ Ny liste</button></div>';

  // Underkategorier som egne bokser
  h+=katUnderBokserHTML(cat,alleEvs,naereIds);

  // Det som hører til en underkategori vises bare i sin egen boks
  var underIdsAlle=cats.filter(function(c){return c.parentId===cat.id;}).map(function(c){return c.id;});
  var iUnder=function(list){return(list||[]).some(function(cid){return underIdsAlle.indexOf(cid)>=0;});};
  var pInv=inventories.filter(function(iv){
    var ic=iv.catIds&&iv.catIds.length?iv.catIds:(iv.catId?[iv.catId]:[]);
    return(iv.type||'inventar')==='prosjekt'&&inCat(ic)&&!iUnder(ic);
  }).sort(function(a,b){return nbSort(dispName(a),dispName(b));});
  var pRes=frittResultater().filter(function(r){return inCat(catsForResult(r))&&!iUnder(catsForResult(r));})
    .sort(function(a,b){return nbSort(resultShortTitle(a),resultShortTitle(b));});
  if(pInv.length||pRes.length){
    h+='<div class="sec-title">Prosjekter</div><div class="card">';
    pInv.forEach(function(iv){
      h+='<div class="entry-row" style="cursor:pointer" onclick="goInventar(\''+q(iv.id)+'\')">'
        +'<div class="entry-body"><div class="entry-text">'+esc(dispName(iv))
        +' <span style="font-size:10px;font-weight:400;color:var(--rose)">\u00b7 '+esc(prosjekttypeName(iv.subtype).toLowerCase())+'</span></div>'
        +'<div class="entry-date">'+(iv.completedDate?'\u2713 ferdig '+fmtDate(iv.completedDate):(iv.endDate?'frist '+fmtDate(iv.endDate):'ingen frist'))+'</div></div>'
        +'<span style="align-self:center;color:var(--rose)">\u203a</span></div>';
    });
    pRes.forEach(function(r){
      h+='<div class="entry-row" style="cursor:pointer" onclick="openEditResult(\''+q(r.id)+'\')">'
        +'<div class="entry-body"><div class="entry-text">'+esc(resultShortTitle(r))+(r.achieved?' <span style="font-size:10px;color:var(--red)">\u00b7 \u2713</span>':'')+'</div>'
        +'<div class="entry-date">frist '+MND_FULL[r.month-1]+' '+r.year+'</div></div>'
        +'<span style="align-self:center;color:var(--rose)">\u203a</span></div>';
    });
    h+='</div>';
  }

  var listeInv=inventories.filter(function(iv){
    var ic=iv.catIds&&iv.catIds.length?iv.catIds:(iv.catId?[iv.catId]:[]);
    return!iv.fixed&&(iv.type||'inventar')==='inventar'&&inCat(ic)&&!iUnder(ic);
  }).sort(function(a,b){return nbSort(a.name,b.name);});
  if(listeInv.length){
    h+='<div class="sec-title">Lister</div><div class="card">'
      +listeInv.map(function(iv){
        var c=invCounts(iv);
        return'<div class="entry-row" style="cursor:pointer" onclick="goInventar(\''+q(iv.id)+'\')">'
          +'<div class="entry-body"><div class="entry-text">'+esc(iv.name)+'</div>'
          +'<div class="entry-date">'+c.have+' av '+c.total+(c.missing?' <span style="color:var(--amber)">\u00b7 gjenst\u00e5r '+c.missing+'</span>':'')+'</div></div>'
          +'<span style="align-self:center;color:var(--rose)">\u203a</span></div>';
      }).join('')+'</div>';
  }

  // Rutiner nederst — avhaking og redigering samlet i ett kort
  var rts=routines.filter(function(r){return inCat(r.cats)&&!iUnder(r.cats);}).sort(function(a,b){return nbSort(a.name,b.name);});
  h+=katRutineKnapperHTML(ids,rts);

  return h+katSideSlutt();
}

// Dating-kriterier: helt fritt redigerbart oppsett. Kriteriene (kolonnene) og
// personene (radene) legges til, endres og fjernes av brukeren selv — ingen
// fastlåst liste, siden det er nettopp det hun ba om.
// Tre kriterietyper, felles for Dating og Stillingsrelevans. Erstatter det
// gamle systemet med separat type/vekt/dealbreaker — n\u00f8dvendig fungerer n\u00e5 som
// dealbreaker automatisk, ikke som et eget valgfritt merke.
var KRIT_TYPER=['nodvendig','viktig','onskelig'];
var KRIT_TYPE_NAVN={nodvendig:'N\u00f8dvendig',viktig:'Viktig',onskelig:'\u00d8nskelig'};
var KRIT_TYPE_VEKT={nodvendig:3,viktig:2,onskelig:1};
function neste3Type(t){return KRIT_TYPER[(KRIT_TYPER.indexOf(t)+1)%3];}
function leggTilDatingKriterium(navn){
  navn=(navn||'').trim();if(!navn)return;
  datingKriterier.push({id:'dk'+Date.now()+Math.random().toString(36).slice(2,4),navn:navn,type:'nodvendig',faseRelevans:'utvalg',fasthet:'fast'});
  save();render();
}
function syklDatingKriteriumType(id){
  var k=datingKriterier.find(function(x){return x.id===id;});
  if(!k)return;
  k.type=neste3Type(k.type);
  save();render();
}
function syklDatingKriteriumFaseRelevans(id){
  var k=datingKriterier.find(function(x){return x.id===id;});
  if(!k)return;
  k.faseRelevans=k.faseRelevans==='etablert'?'utvalg':'etablert';
  save();render();
}
function syklDatingKriteriumFasthet(id){
  var k=datingKriterier.find(function(x){return x.id===id;});
  if(!k)return;
  k.fasthet=k.fasthet==='situasjonsbetinget'?'fast':'situasjonsbetinget';
  save();render();
}
// Et etablert-kriterium l\u00e5ses til dere er forbi de tre f\u00f8rste m\u00e5nedene — ikke
// helt til ett \u00e5r+, siden det er skillet som faktisk gir mening her.
function datingKriteriumLast(k,p){
  return k.faseRelevans==='etablert'&&(p.fase||0)<1;
}
function fjernDatingKriterium(id){
  datingKriterier=datingKriterier.filter(function(k){return k.id!==id;});
  datingPersoner.forEach(function(p){if(p.kryssStatus)delete p.kryssStatus[id];});
  save();render();
}
var DATING_FASER=['0\u20133 mnd','4\u201312 mnd','1 \u00e5r+'];
var datingSortering='manuell';
function settDatingSortering(v){datingSortering=v;save();render();}
function leggTilDatingPerson(navn){
  navn=(navn||'').trim();if(!navn)return;
  datingPersoner.push({id:'dp'+Date.now()+Math.random().toString(36).slice(2,4),navn:navn,kryssStatus:{},fase:0,avsluttet:false});
  save();render();
}
function toggleDatingAvsluttet(id){
  var p=datingPersoner.find(function(x){return x.id===id;});
  if(!p)return;
  p.avsluttet=!p.avsluttet;
  save();render();
}
function flyttDatingFase(personId){
  var p=datingPersoner.find(function(x){return x.id===personId;});
  if(!p)return;
  p.fase=Math.min((p.fase||0)+1,DATING_FASER.length-1);
  save();render();
}
function settDatingFase(personId,faseIndex){
  var p=datingPersoner.find(function(x){return x.id===personId;});
  if(!p)return;
  p.fase=Math.max(0,Math.min(faseIndex,DATING_FASER.length-1));
  save();render();
}
function fjernDatingPerson(id){
  datingPersoner=datingPersoner.filter(function(p){return p.id!==id;});
  save();render();
}
function flyttDatingPerson(id,retning){
  var i=datingPersoner.findIndex(function(p){return p.id===id;});
  if(i<0)return;
  var j=i+retning;
  if(j<0||j>=datingPersoner.length)return;
  var tmp=datingPersoner[i];datingPersoner[i]=datingPersoner[j];datingPersoner[j]=tmp;
  save();render();
}
// Firetrinns fargesyklus per kryss: tomt \u2192 gr\u00e5tt \u2192 gr\u00f8nt \u2192 gult \u2192 r\u00f8dt \u2192 tomt.
// Gr\u00e5tt/beige = vet ikke/ikke nok data, gr\u00f8nt = mye av egenskapen, gult = noe,
// r\u00f8dt = mangler den. Bruker appens egen palett — --done og --red finnes fra
// f\u00f8r, gr\u00f8nt og gult er nye, dempede toner i samme stil.
var DATING_KRYSS_FARGER=['','#E3D9C2','#7A9B76','#D4B354','#8E1F1D'];
// Poengsum per person: n\u00f8dvendige kriterier teller dobbelt av tiltrekkende, og
// selve fargen rangeres gr\u00f8nn (mye) h\u00f8yest, s\u00e5 gr\u00e5tt (usikker), s\u00e5 gult (noe),
// s\u00e5 r\u00f8dt (mangler) lavest.
var DATING_STATUS_POENG={1:2,2:3,3:1,4:0};
function datingKryssPoeng(p){
  var st=p.kryssStatus||{};
  var sum=0;
  Object.keys(st).forEach(function(kid){
    var k=datingKriterier.find(function(x){return x.id===kid;});
    if(!k)return;
    sum+=(DATING_STATUS_POENG[st[kid]]||0)*(KRIT_TYPE_VEKT[k.type]||1);
  });
  return sum;
}
// Et n\u00f8dvendig kriterium kan ikke st\u00e5 p\u00e5 r\u00f8dt — da utg\u00e5r personen, automatisk,
// uten noe eget dealbreaker-merke \u00e5 sette.
function datingUtgar(p){
  var st=p.kryssStatus||{};
  return datingKriterier.some(function(k){return k.type==='nodvendig'&&st[k.id]===4;});
}
function sykleDatingKryss(personId,kriterieId){
  var p=datingPersoner.find(function(x){return x.id===personId;});
  if(!p)return;
  p.kryssStatus=p.kryssStatus||{};
  var naa=p.kryssStatus[kriterieId]||0;
  var neste=(naa+1)%DATING_KRYSS_FARGER.length;
  if(neste===0)delete p.kryssStatus[kriterieId];else p.kryssStatus[kriterieId]=neste;
  save();render();
}
function settDatingNavn(personId,navn){
  var p=datingPersoner.find(function(x){return x.id===personId;});
  if(!p)return;
  p.navn=(navn||'').trim()||p.navn;
  save();render();
}

function datingKriterierViewHTML(){
  var h='<div style="padding:14px 12px 0"><button class="icon-btn" onclick="goBack()">\u2039</button></div>'
    +'<div class="view-title">Kriterier</div>'
    +'<div class="view-sub">Dine egne — legg til, endre eller fjern n\u00e5r som helst.</div>';

  // Tre niv\u00e5er, samme prinsipp som Stillingsrelevans: aktive \u00f8verst, avsluttede
  // forhold som referanse under der, avsluttet uten \u00e5 ha blitt et forhold nederst.
  function datingReferanseTier(p){
    if(datingUtgar(p))return 3;
    if(!p.avsluttet)return 0;
    return(p.fase||0)>=1?1:2;
  }
  var visPersoner=datingPersoner.slice();
  visPersoner.sort(function(a,b){
    var at=datingReferanseTier(a),bt=datingReferanseTier(b);
    if(at!==bt)return at-bt;
    if(datingSortering==='varighet')return(b.fase||0)-(a.fase||0);
    if(datingSortering==='kryss'){
      var aDb=datingUtgar(a),bDb=datingUtgar(b);
      if(aDb!==bDb)return aDb?1:-1;
      return datingKryssPoeng(b)-datingKryssPoeng(a);
    }
    if(datingSortering==='alfabetisk')return nbSort(a.navn,b.navn);
    return 0;
  });

  // Rekkef\u00f8lge: utvalgsfase f\u00f8r etablert, dealbreakere f\u00f8rst innad i hver, s\u00e5
  // h\u00f8yest vektet, med type som siste tiebreak n\u00e5r alt annet er likt.
  var kriterierSortert=datingKriterier.slice().sort(function(a,b){
    var fa=a.faseRelevans==='etablert'?1:0,fb=b.faseRelevans==='etablert'?1:0;
    if(fa!==fb)return fa-fb;
    return KRIT_TYPER.indexOf(a.type)-KRIT_TYPER.indexOf(b.type);
  });
  var antUtvalg=kriterierSortert.filter(function(k){return k.faseRelevans!=='etablert';}).length;

  if(datingPersoner.length){

        return'<button class="chip'+(datingSortering===s[0]?' on':'')+'" onclick="settDatingSortering(\''+s[0]+'\')">'+s[1]+'</button>';
      }).join('')+'</div>';
    h+='<div id="dating-tabell-scroll" class="card" style="overflow-x:auto;padding:8px 6px">'
      +'<table style="border-collapse:collapse;font-size:11px">'
      +(kriterierSortert.length?'<tr><td colspan="'+(1+DATING_FASER.length+1)+'"></td>'
        +(antUtvalg?'<td colspan="'+antUtvalg+'" style="text-align:center;font-size:8.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em">Dating</td>':'')
        +(kriterierSortert.length-antUtvalg?'<td colspan="'+(kriterierSortert.length-antUtvalg)+'" style="text-align:center;font-size:8.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em">Forhold</td>':'')
        +'</tr>':'')
      +'<tr><td></td>'+DATING_FASER.map(function(f){
        return'<td style="text-align:center;padding:2px 4px;font-size:9px;color:var(--muted);white-space:nowrap">'+f+'</td>';
      }).join('')+'<td></td>'
      +kriterierSortert.map(function(k){
        return'<td style="text-align:center;padding:2px 3px;font-size:9px;color:var(--muted);max-width:44px;writing-mode:vertical-rl;text-orientation:mixed">'+(k.fasthet==='situasjonsbetinget'?'~ ':'')+esc(k.navn)+'</td>';
      }).join('')+'</tr>'
      +visPersoner.map(function(p){
        var fase=p.fase||0;
        return'<tr style="'+(p.avsluttet?'opacity:.5':'')+'"><td style="padding:3px 6px 3px 0;white-space:nowrap;position:sticky;left:0;background:var(--card);z-index:1">'+(datingUtgar(p)?'\u26a0 ':'')+esc(p.navn)+'</td>'
          +DATING_FASER.map(function(f,i){
            return'<td style="text-align:center;padding:2px"><button title="Sett til '+esc(f)+'" onclick="settDatingFase(\''+q(p.id)+'\','+i+')" style="width:13px;height:13px;border-radius:50%;border:none;padding:0;cursor:pointer;background:'+(i<=fase?'var(--rose)':'var(--line)')+'"></button></td>';
          }).join('')
          +'<td style="text-align:center;padding:2px">'+(fase<DATING_FASER.length-1?'<button onclick="flyttDatingFase(\''+q(p.id)+'\')" title="Flytt til '+esc(DATING_FASER[fase+1])+'" style="font-size:12px;padding:1px 6px" class="icon-btn">\u2192</button>':'')+'</td>'
          +kriterierSortert.map(function(k){
            var status=(p.kryssStatus||{})[k.id]||0;
            var farge=DATING_KRYSS_FARGER[status];
            if(datingKriteriumLast(k,p)){
              return'<td style="text-align:center;padding:2px"><span title="L\u00e5st \u2014 relevant f\u00f8rst n\u00e5r forholdet er etablert" style="display:inline-block;width:20px;height:20px;border-radius:4px;border:1.5px dashed var(--line);color:var(--muted);font-size:11px;line-height:18px">\ud83d\udd12</span></td>';
            }
            return'<td style="text-align:center;padding:2px"><button onclick="sykleDatingKryss(\''+q(p.id)+'\',\''+q(k.id)+'\')" style="width:20px;height:20px;border-radius:4px;border:1.5px solid var(--line);background:'+(farge||'transparent')+';padding:0;cursor:pointer"></button></td>';
          }).join('')
          +'</tr>';
      }).join('')
      +'</table></div>';

  // Kriterielista sorteres for lesbarhet — dealbreakere \u00f8verst, s\u00e5 n\u00f8dvendige,

    +'<table style="border-collapse:collapse;font-size:11px;width:100%">'
    +'<tr><td></td>'
    +['Type','Fase','Fasthet'].map(function(t){return'<td style="text-align:center;padding:2px 4px;font-size:9px;color:var(--muted)">'+t+'</td>';}).join('')
    +'<td></td></tr>'
    +kriterierForListe.map(function(k){
      return'<tr><td style="padding:3px 6px 3px 0;font-size:12px;max-width:120px">'+esc(k.navn)+'</td>'
        +'<td style="text-align:center;padding:2px"><button class="chip'+(k.type==='nodvendig'?' on':'')+'" style="font-size:10px;padding:2px 6px" onclick="syklDatingKriteriumType(\''+q(k.id)+'\')">'+KRIT_TYPE_NAVN[k.type]+'</button></td>'
        +'<td style="text-align:center;padding:2px"><button class="chip" style="font-size:10px;padding:2px 6px" onclick="syklDatingKriteriumFaseRelevans(\''+q(k.id)+'\')">'+(k.faseRelevans==='etablert'?'Forhold':'Dating')+'</button></td>'
        +'<td style="text-align:center;padding:2px"><button class="chip" style="font-size:10px;padding:2px 6px" onclick="syklDatingKriteriumFasthet(\''+q(k.id)+'\')">'+(k.fasthet==='situasjonsbetinget'?'Situa':'Fast')+'</button></td>'
        +'<td style="text-align:center;padding:2px"><button class="icon-btn" style="font-size:10px;padding:1px 6px" onclick="fjernDatingKriterium(\''+q(k.id)+'\')">Fjern</button></td>'
        +'</tr>';
    }).join('')
    +'</table>'
    +(datingKriterier.length?'':'<div class="empty" style="padding:6px 12px">Ingen kriterier enn\u00e5.</div>')
    +'</div>'
    +'<div style="padding:6px 12px 0;display:flex;gap:6px">'

    +'</div>';

  h+='<div class="sec-title" style="margin-top:14px">Personer</div><div class="card">'
    +visPersoner.map(function(p){
      var iEkte=datingPersoner.indexOf(p); // ekte posisjon, for piler som flytter i den lagrede rekkef\u00f8lgen
      var visPiler=datingSortering==='manuell';
      return'<div class="entry-row" style="align-items:flex-start'+(p.avsluttet?';opacity:.6':'')+'"><div class="entry-body">'
        +(datingUtgar(p)?'<div style="font-size:10px;color:var(--red);font-weight:700;margin-bottom:2px">\u26a0 N\u00f8dvendig kriterium mangler \u2014 utg\u00e5r</div>':'')
        +'<input class="inp" type="text" style="font-size:13px;font-weight:600;margin:0;padding:4px 6px" value="'+esc(p.navn)+'" onblur="settDatingNavn(\''+q(p.id)+'\',this.value)">'
        +'<div class="chips" style="margin-top:3px">'+DATING_FASER.map(function(f,i){
          return'<button class="chip'+(i===(p.fase||0)?' on':'')+'" style="font-size:10px;padding:2px 8px" onclick="settDatingFase(\''+q(p.id)+'\','+i+')">'+f+'</button>';
        }).join('')
        +'<button class="chip'+(p.avsluttet?' on':'')+'" style="font-size:10px;padding:2px 8px;margin-left:4px" onclick="toggleDatingAvsluttet(\''+q(p.id)+'\')">Avsluttet</button>'
        +'</div>'
        +'</div>'
        +(visPiler?'<div style="display:flex;flex-direction:column;gap:2px;flex-shrink:0">'
          +(iEkte>0?'<button class="icon-btn" style="font-size:10px;padding:0 5px" onclick="flyttDatingPerson(\''+q(p.id)+'\',-1)">\u2191</button>':'')
          +(iEkte<datingPersoner.length-1?'<button class="icon-btn" style="font-size:10px;padding:0 5px" onclick="flyttDatingPerson(\''+q(p.id)+'\',1)">\u2193</button>':'')
          +'</div>':'')
        +'<button class="icon-btn" style="font-size:11px;flex-shrink:0" onclick="fjernDatingPerson(\''+q(p.id)+'\')">Fjern</button></div>';

    +(datingPersoner.length?'':'<div class="empty" style="padding:6px 12px">Ingen personer lagt til enn\u00e5.</div>')

  return h;

}
function syklStillingKriteriumFasthet(id){

// Et etablert-kriterium l\u00e5ses til du faktisk n\u00e5r siste stadie — «Hatt denne
// jobben» — ikke bare v\u00e6rt i prosess.
function stillingKriteriumLast(k,s){
  return k.faseRelevans==='etablert'&&(s.stadie||0)<STILLING_STADIER.length-1;
}
function fjernStillingKriterium(id){
  stillingKriterier=stillingKriterier.filter(function(k){return k.id!==id;});
  stillinger.forEach(function(s){if(s.kryssStatus)delete s.kryssStatus[id];});
  save();render();
}
var STILLING_STADIER=['Vurderer','S\u00f8kt','Ikke f\u00e5tt','Hatt denne jobben'];
var stillingSortering='manuell';

function leggTilStilling(navn){
  navn=(navn||'').trim();if(!navn)return;
  stillinger.push({id:'sp'+Date.now()+Math.random().toString(36).slice(2,4),navn:navn,kryssStatus:{},stadie:0});
  save();render();
}
function flyttStillingStadie(id){
  var s=stillinger.find(function(x){return x.id===id;});
  if(!s)return;
  s.stadie=Math.min((s.stadie||0)+1,STILLING_STADIER.length-1);
  save();render();
}
function settStillingStadie(id,stadieIndex){
  var s=stillinger.find(function(x){return x.id===id;});
  if(!s)return;
  s.stadie=Math.max(0,Math.min(stadieIndex,STILLING_STADIER.length-1));
  save();render();
}
function fjernStilling(id){
  stillinger=stillinger.filter(function(s){return s.id!==id;});
  save();render();
}
function flyttStilling(id,retning){
  var i=stillinger.findIndex(function(s){return s.id===id;});
  if(i<0)return;
  var j=i+retning;
  if(j<0||j>=stillinger.length)return;
  var tmp=stillinger[i];stillinger[i]=stillinger[j];stillinger[j]=tmp;
  save();render();
}
var STILLING_KRYSS_FARGER=['','#E3D9C2','#7A9B76','#D4B354','#8E1F1D'];
var STILLING_STATUS_POENG={1:2,2:3,3:1,4:0};
function stillingKryssPoeng(s){
  var st=s.kryssStatus||{};
  var sum=0;
  Object.keys(st).forEach(function(kid){
    var k=stillingKriterier.find(function(x){return x.id===kid;});
    if(!k)return;
    sum+=(STILLING_STATUS_POENG[st[kid]]||0)*(KRIT_TYPE_VEKT[k.type]||1);
  });
  return sum;
}
function stillingUtgar(s){
  var st=s.kryssStatus||{};
  return stillingKriterier.some(function(k){return k.type==='nodvendig'&&st[k.id]===4;});
}
function sykleStillingKryss(stillingId,kriterieId){
  var s=stillinger.find(function(x){return x.id===stillingId;});
  if(!s)return;
  s.kryssStatus=s.kryssStatus||{};
  var naa=s.kryssStatus[kriterieId]||0;
  var neste=(naa+1)%STILLING_KRYSS_FARGER.length;
  if(neste===0)delete s.kryssStatus[kriterieId];else s.kryssStatus[kriterieId]=neste;
  save();render();
}
function settStillingNavn(id,navn){
  var s=stillinger.find(function(x){return x.id===id;});
  if(!s)return;
  s.navn=(navn||'').trim()||s.navn;
  save();render();
}

function stillingRelevansViewHTML(){

    +'<div class="view-title">Stillingsrelevans</div>'
    +'<div class="view-sub">Dine egne kriterier — legg til, endre eller fjern n\u00e5r som helst.</div>';

  // Tre niv\u00e5er: aktive vurderinger \u00f8verst, «Hatt denne jobben» som referanse
  // under der, «Ikke f\u00e5tt» aller nederst — det er et utfall, ikke fremgang.
  function stillingReferanseTier(s){
    if(stillingUtgar(s))return 3;
    var st=s.stadie||0;
    if(st===2)return 2; // Ikke f\u00e5tt
    if(st===3)return 1; // Hatt denne jobben
    return 0;
  }
  var visStillinger=stillinger.slice();
  visStillinger.sort(function(a,b){
    var at=stillingReferanseTier(a),bt=stillingReferanseTier(b);
    if(at!==bt)return at-bt;
    if(stillingSortering==='varighet')return(b.stadie||0)-(a.stadie||0);
    if(stillingSortering==='kryss'){
      var aDb=stillingUtgar(a),bDb=stillingUtgar(b);
      if(aDb!==bDb)return aDb?1:-1;
      return stillingKryssPoeng(b)-stillingKryssPoeng(a);

    if(stillingSortering==='alfabetisk')return nbSort(a.navn,b.navn);

  var kriterierSortert=stillingKriterier.slice().sort(function(a,b){

        +(kriterierSortert.length-antUtvalg?'<td colspan="'+(kriterierSortert.length-antUtvalg)+'" style="text-align:center;font-size:8.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em">Arbeidsforhold</td>':'')
        +'</tr>':'')
      +'<tr><td></td>'+STILLING_STADIER.map(function(f){
        return'<td style="text-align:center;padding:2px 4px;font-size:9px;color:var(--muted);white-space:nowrap">'+f+'</td>';
      }).join('')+'<td></td>'
      +kriterierSortert.map(function(k){
        return'<td style="text-align:center;padding:2px 3px;font-size:9px;color:var(--muted);max-width:44px;writing-mode:vertical-rl;text-orientation:mixed">'+(k.fasthet==='situasjonsbetinget'?'~ ':'')+esc(k.navn)+'</td>';
      }).join('')+'</tr>'
      +visStillinger.map(function(s){

        return'<tr><td style="padding:3px 6px 3px 0;white-space:nowrap;position:sticky;left:0;background:var(--card);z-index:1">'+(stillingUtgar(s)?'\u26a0 ':'')+esc(s.navn)+'</td>'

            // Vurderer/S\u00f8kt (0,1) er kumulativ fremgang. Ikke f\u00e5tt/Hatt denne

          +kriterierSortert.map(function(k){

        +'<td style="text-align:center;padding:2px"><button class="chip" style="font-size:10px;padding:2px 6px" onclick="syklStillingKriteriumFaseRelevans(\''+q(k.id)+'\')">'+(k.faseRelevans==='etablert'?'Arb.forh':'Jobbs\u00f8k')+'</button></td>'

  h+='<div class="sec-title" style="margin-top:14px">Stillinger</div><div class="card">'

function oversiktTree(inv,onlyHave){
  var UTEN='\u2013 uten plassering';
  var tree={};
  (inv.items||[]).forEach(function(it){
    if(onlyHave&&!it.have)return;
    var v=it.values||{};
    var p1=(v.__p1||'').trim()||UTEN;
    var p2=(v.__p2||'').trim();
    var p3=(v.__p3||'').trim();
    tree[p1]=tree[p1]||{};tree[p1][p2]=tree[p1][p2]||{};
    tree[p1][p2][p3]=tree[p1][p2][p3]||[];

// ── Menstruasjonstracker ──
// Datamodell: {id, start:'YYYY-MM-DD', end:'YYYY-MM-DD'|'', note:'', intensity:1-4|null}
function mensSorted(){return mens.slice().sort(function(a,b){return a.start<b.start?1:-1;});} // nyeste først
function mensSiste(){var s=mensSorted();return s.length?s[0]:null;}
function mensSykluslengder(){
  var s=mens.slice().sort(function(a,b){return a.start<b.start?-1:1;}).map(function(m){return m.start;});
  var out=[];
  for(var i=1;i<s.length;i++){
    var d=Math.round((new Date(s[i])-new Date(s[i-1]))/86400000);
    if(d>0&&d<90)out.push(d); // filtrerer bort urimelige hopp, f.eks. feilregistreringer
  }
  return out;
}
function mensSnittSyklus(){
  // Et kjent, langvarig snitt er mer p\u00e5litelig enn et par nylogg\u00e9de sykluser i denne
  // appen \u2014 s\u00e5 det kjente tallet f\u00e5r styre helt til brukeren selv sier noe annet.
  if(mensManuellSyklus)return mensManuellSyklus;
  var l=mensSykluslengder();
  if(!l.length)return null;
  var siste=l.slice(-6);
  return Math.round(siste.reduce(function(a,b){return a+b;},0)/siste.length);
}
function mensSnittLengde(){
  if(mensManuellVarighet)return mensManuellVarighet;
  var l=mens.filter(function(m){return m.start&&m.end&&m.end>=m.start;})
    .map(function(m){return Math.round((new Date(m.end)-new Date(m.start))/86400000)+1;})
    .filter(function(d){return d>0&&d<20;});
  if(!l.length)return null;
  var siste=l.slice(-6);
  return Math.round(siste.reduce(function(a,b){return a+b;},0)/siste.length*10)/10;
}
function mensDagIDag(){
  var siste=mensSiste();if(!siste)return null;
  var d=Math.round((new Date(isoDate(today))-new Date(siste.start))/86400000)+1;
  return d>0?d:null;
}
function mensNesteDato(){
  var siste=mensSiste();if(!siste)return null;
  var snitt=mensSnittSyklus();if(!snitt)return null;
  var d=new Date(siste.start+'T00:00:00');d.setDate(d.getDate()+snitt);
  return isoDate(d);
}
function mensDagerTilNeste(){
  var neste=mensNesteDato();if(!neste)return null;
  return Math.round((new Date(neste)-new Date(isoDate(today)))/86400000);
}
// Dagsmerker for en vilkårlig dato — brukt både på mens-siden (for i dag) og
// som «tvilling» på Dag-siden i Loggføring, så begge alltid viser samme greie.
// Perioden som dekker en gitt dato — en pågående periode regnes som løpende til i dag
// ── Syklus ────────────────────────────────────────────────────────────
// Selve trackeren er en egen app (syklus.html). Her leses bare registrerte
// perioder, så appen vet hvilken syklusdag det er — og kalenderen kan farge
// dagene. Ingenting registreres herfra.
// Stien til Syklus kan endres i Innstillinger — ligger fila et annet sted eller
// har et annet navn, skal ikke knappen føre til en blank feilside.
// ── Ballongflokk ───────────────────────────────────────────────────────
// På bursdagen fylles lavendelfeltet med én ballong per år personen fyller.
// Fargene hentes fra kategoripaletten, med en lysere og en mørkere variant av
// hver, så flokken føles som appen og ikke som fremmed konfetti.
// Nøyaktig de tjue fargene fra båndet i banneret, uten lysere eller mørkere
// varianter — så ballongene og båndet snakker samme språk.
// Hver person kan få sin egen ballongfarge. Lagres på bursdagshendelsen, så
// den følger personen overalt ballongen dukker opp.
function personBallongFarge(person){
  var bd=bdayForPerson(person);
  return(bd&&bd.ballongFarge)||'';
}
function settPersonBallongFarge(person,hex){
  var bd=bdayForPerson(person);
  if(!bd)return;
  if(hex)bd.ballongFarge=hex;else delete bd.ballongFarge;
  save();render();
}
function personBallongSVG(person,px){
  return ballongSVG(px,personBallongFarge(person)||null);
}
function ballongFargevelgerHTML(person){

      return'<button class="chip" title="'+esc(c.name)+'" style="background:'+c.hex+';border-color:'+(pa?'var(--ink)':c.hex)+';color:'+textOn(c.hex)+';padding:3px 10px"'
        +' onclick="settPersonBallongFarge(\''+q(person)+'\',\''+q(c.hex)+'\')">'+(pa?'\u2713 ':'')+esc(c.name)+'</button>';
    }).join('')
    +'</div>';
