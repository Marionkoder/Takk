function ballongPalett(){
  return CAT_COLORS.map(function(c){return c.hex;});
}
// Enkel deterministisk pseudotilfeldighet, så flokken ikke stokker om seg selv
// ved hver render — men ser tilfeldig ut, og er ulik fra person til person.
function froTall(fro,i){
  var x=Math.sin(fro*9301+i*49297)*233280;
  return x-Math.floor(x);
}
function froFraTekst(t){
  var sum=0;
  String(t||'').split('').forEach(function(c,i){sum+=c.charCodeAt(0)*(i+1);});
  return sum||1;
}
// To like farger skal aldri stå ved siden av hverandre.
function ballongFarger(antall,fro){
  var pal=ballongPalett(),ut=[],forrige=null;
  for(var i=0;i<antall;i++){
    var f,forsok=0;
    do{
      f=pal[Math.floor(froTall(fro,i*7+forsok)*pal.length)];
      forsok++;
    }while(f===forrige&&forsok<12);
    ut.push(f);forrige=f;
  }
  return ut;
}
// Tegner et gitt utsnitt av flokken. fraIdx holder fargerekka sammenhengende,
// slik at over- og underdelen deler én rekke og ingen naboer blir like.
function ballongRaderHTML(farger,fraIdx,antall,marg){
  if(antall<1)return'';
  var hoyde=34; // samme størrelse som den enkelte ballongen i bursdagsradene
  // Deles i rader og fordeles jevnt, slik at hver rad har omtrent like mange og
  // strekker seg helt ut til begge kanter. Space-between alene ville gitt en
  // halvtom siste rad med diger luft mellom ballongene.
  var perRad=12;
  var rader=Math.max(1,Math.ceil(antall/perRad));
  var grunn=Math.floor(antall/rader),rest=antall%rader;
  var h='<div style="'+(marg||'margin:10px 0 2px')+'">',k=fraIdx;
  for(var r=0;r<rader;r++){
    var iRad=grunn+(r<rest?1:0);
    h+='<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:2px">';
    for(var j=0;j<iRad;j++,k++){
      // Litt ulik høyde og helling, så flokken ikke ser oppstilt ut
      var vipp=(froTall(k*3+1,k*3+1)*16-8).toFixed(1);
      var loft=Math.round(froTall(k*5+2,k*5+2)*7);
      h+='<span style="display:inline-block;flex-shrink:0;margin-bottom:'+loft+'px;transform:rotate('+vipp+'deg)">'
        +ballongSVG(hoyde,farger[k])+'</span>';
    }
    h+='</div>';
  }
  return h+'</div>';
}
// Til og med fem år står alle ballongene over teksten. Over det deles flokken
// likt over og under, med den ekstra ballongen øverst ved oddetall.
function ballongDeling(antall){
  var n=Math.min(antall||0,120);
  if(n<1)return{over:0,under:0,n:0};
  if(n<=5)return{over:n,under:0,n:n};
  var over=Math.ceil(n/2);
  return{over:over,under:n-over,n:n};
}
function ballongFlokkHTML(antall,fro){

// Bursdagsikon: liten blå ballong. Tegnet som SVG fordi ballongemojien alltid

// ── Ballonghimmel ──────────────────────────────────────────────────────
// Erstatter mosaikken. Ett stikkord får sin egen ballong når det er brukt
// 50 ganger i dagboka — ikke før. Fargen kommer fra kategorien stikkordet er
// tilordnet (respekterer en underkategoris egen farge, om den har en).
// Størrelsen vokser i faste trinn, aldri jevnt, så en dobling faktisk kjennes.
var STIKKORD_STORRELSE=[[50,46],[100,60],[150,72],[200,82],[250,91],[500,120],[1000,155]];
function stikkordBallongStorrelse(n){
  var s=STIKKORD_STORRELSE[0][1];
  for(var i=0;i<STIKKORD_STORRELSE.length;i++)if(n>=STIKKORD_STORRELSE[i][0])s=STIKKORD_STORRELSE[i][1];
  return s;
}
// Egen tegning, ikke ballongSVG, fordi denne kan bære teksten selv når det er
// plass. Teksten er alltid samme lokale enhet som selve ballongen, så den
// skalerer nøyaktig i takt med størrelsen uten noe eget regnestykke.
function stikkordBallongSVG(px,farge,tekst,localFont,tekstFarge){
  var h=px;
  return'<svg viewBox="0 0 26 38" style="height:'+h+'px;width:auto;flex-shrink:0" aria-hidden="true">'
    +'<path d="M13 1.6C18.6 1.6 22.6 6.2 22.6 11.9C22.6 18 18.5 24 13 26.6C7.5 24 3.4 18 3.4 11.9C3.4 6.2 7.4 1.6 13 1.6Z" style="fill:'+farge+'"/>'
    +'<path d="M13 26.6C18.5 24 22.6 18 22.6 11.9C22.6 8.6 21.3 5.7 19.2 3.8C20.3 5.5 20.9 7.6 20.9 9.9C20.9 16 16.8 22 11.3 24.6C10.6 25 10 25.3 13 26.6Z" style="fill:#2A2A2A;opacity:.22"/>'
    +'<ellipse cx="8.8" cy="8.2" rx="1.7" ry="2.9" transform="rotate(-25 8.8 8.2)" style="fill:#fff;opacity:.4"/>'
    +'<path d="M11.4 26.2L14.6 26.2L13 29Z" style="fill:'+farge+'"/>'
    +'<path d="M13 29c0 2.2 2.6 2.6 2.6 4.8 0 1.8-2.2 2.2-2.2 3.4" style="fill:none;stroke:var(--ballongsnor);stroke-width:1;stroke-linecap:round"/>'
    +(tekst?'<text x="13" y="14" text-anchor="middle" font-size="'+localFont.toFixed(2)+'" fill="'+tekstFarge+'">'+esc(tekst)+'</text>':'')
    +'</svg>';
}
function ballonghimmelHTML(){
  var telling=allTags();
  var rader=Object.keys(telling).filter(function(t){return telling[t]>=50;})
    .map(function(t){
      var cid=tagCats[t];
      return{tag:t,n:telling[t],farge:(cid&&catColor(cid))||'#B08D7C'};
    })
    .sort(function(a,b){return nbSort(a.tag,b.tag);}); // fast rekkefølge, fritt blandet i størrelse
  if(!rader.length)return'';
  var h='<div class="sec-title">Mest takknemlig for</div><div class="card"><div style="display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;padding:16px 14px 12px">';
  rader.forEach(function(r){
    var H=stikkordBallongStorrelse(r.n);
    var Ffinal=Math.min(16,Math.max(9,H*0.16));

// «Menstruasjon over» setter sluttdato til denne dagen. Trykk igjen for å angre,
// da regnes perioden som pågående på nytt.
// Eggl\u00f8sningsslim — enkel av/p\u00e5-markering, ingen skala. Det som betyr noe er om du
// la merke til det, ikke hvor mye.
// Starter en ny menstruasjon på denne datoen
// Én rad: liten overskrift over knappene, med bare gradueringsordet i hver knapp
// i stedet for at symptomnavnet gjentas ti ganger på siden
// Kompakt tabell: symptomtype som rad, gradering 1\u20134 som kolonne. Erstatter det
// som f\u00f8r var ti separate overskrift+knapperad-blokker — samme data, en br\u00f8kdel
// av plassen. Cellene er sirkler, ikke tekstknapper, siden radnavnet allerede
// sier hva graderingen gjelder.
// Dagsmerker — energi og fokus, to gjensidig utelukkende par du kan sette med ett trykk
// når du kjenner det, uten å måtte vurdere det hver dag.
// Hum\u00f8r er ikke \u00e9n skala — det er flere akser som kan beveges uavhengig av
// hverandre. Derfor egne merker du kan sl\u00e5 av og p\u00e5, ikke en gradert linje.
// Syklusdag for en vilk\u00e5rlig dato, ikke bare i dag — brukes til \u00e5 se merkene i sammenheng med syklusen
function mensSyklusdagForDato(dato){
  var forrige=mens.filter(function(m){return m.start&&m.start<=dato;}).sort(function(a,b){return a.start<b.start?1:-1;})[0];
  if(!forrige)return null;
  var d=Math.round((new Date(dato)-new Date(forrige.start))/86400000)+1;
  return d>0?d:null;
}

// De fire tremåneders-bolkene bakover fra bursdagen (siste 12 mnd)
function birthdayQuarters(){
  var t=today;
  var end=new Date(t.getFullYear(),t.getMonth(),1); // inneværende måned (bursdagsmåneden)
  var blocks=[];
  // 12 måneder fram TIL bursdagsmåneden: mnd (end-11) ... end, delt i 4 bolker à 3
  for(var b=0;b<4;b++){
    var months=[];
    for(var k=0;k<3;k++){
      var offset=11-(b*3+k); // 11..0
      var d=new Date(end.getFullYear(),end.getMonth()-offset,1);
      months.push({y:d.getFullYear(),m:d.getMonth()+1});
    }
    blocks.push(months);
  }
  return blocks;
}
function entriesInMonth(y,m){
  var pre=y+'-'+pad(m);
  return entries.filter(function(e){return (e.date||'').slice(0,7)===pre;});
}
// Fremhevet innlegg: flest av månedens 5 mest brukte hashtagger
function highlightEntryForMonth(y,m){
  var mEntries=entriesInMonth(y,m);
  if(!mEntries.length)return null;
  var counts=tagCountsFor(mEntries);
  var top5=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a]||nbSort(a,b);}).slice(0,5);
  if(!top5.length)return mEntries.slice().sort(function(a,b){return a.date<b.date?1:-1;})[0];
  var best=null,bestScore=-1;
  mEntries.forEach(function(e){
    var score=(e.tags||[]).filter(function(t){return top5.indexOf(t)>=0;}).length;
    if(score>bestScore){bestScore=score;best=e;}
  });
  return best;
}
// Oppnådde milepæler i en periode (prosjekter + prosjekter)
function achievedMilestonesInBlock(months){
  var set={};months.forEach(function(mm){set[mm.y+'-'+pad(mm.m)]=1;});
  var out=[];
  inventories.forEach(function(iv){
    if((iv.type||'inventar')!=='prosjekt')return;
    (iv.items||[]).forEach(function(it){
      if(it.have&&it.date&&set[it.date.slice(0,7)])out.push({name:it.name,from:iv.name});
    });
  });
  results.forEach(function(r){
    (r.milestones||[]).forEach(function(m){
      if(m.done&&m.date&&set[m.date.slice(0,7)])out.push({name:m.name,from:r.name});
    });
  });
  return out;
}

function celebSmallCloud(months){
  // Forminsket ordsky for de tre månedene samlet
  var list=[];months.forEach(function(mm){list=list.concat(entriesInMonth(mm.y,mm.m));});
  var counts=tagCountsFor(list);
  var words=Object.keys(counts).sort(nbSort);
  if(!words.length)return'<div style="color:var(--muted);font-size:13px">Ingen stikkord denne perioden.</div>';
  var max=Math.max.apply(null,words.map(function(w){return counts[w];}));
  return'<div class="cloud" style="justify-content:center">'+words.map(function(w){
    var c=counts[w];var size=11+Math.round((c/max)*9);
    var lv=Math.min(5,1+Math.floor((c-1)/max*5));
    return'<span class="cloud-word lv'+lv+'" style="font-size:'+size+'px;cursor:default">'+esc(w)+'</span>';
  }).join('')+'</div>';
}

        fv2.sections=fv2.sections||[];
        var sec2=fv2.sections.find(function(s){return(s.name||'').toLowerCase()==='garnlager';});
        if(!sec2){sec2={id:'fv_garnlager',name:'Garnlager',parentId:''};fv2.sections.push(sec2);}
        fv2.items=fv2.items||[];
        (oldLager.items||[]).forEach(function(it){
          it.sectionId=sec2.id;
          fv2.items.push(it);
        });
      }
      inventories=inventories.filter(function(iv){return iv.id!==oldLager.id;});
    }
    try{localStorage.setItem(SK+'_garnlager1','1');}catch(e){}
    save();
  }

  // Alle prosjekter skal ha en type — gi eksisterende uten type «Annet prosjekt»
  // Nye felter på rutiner: anker, minsteversjon og logg over minimale dager.
  var ank1=false;try{ank1=!!localStorage.getItem(SK+'_ankere1');}catch(e){}
  if(!ank1){
    routines.forEach(function(r){
      if(!r.ankere)r.ankere=[];
      if(r.minste===undefined)r.minste='';
      if(!r.minsteLog)r.minsteLog=[];
    });
    try{localStorage.setItem(SK+'_ankere1','1');}catch(e){}
    save();
  }

  // Fem farger er fjernet fra paletten (se FJERNEDE_FARGER). Kategorier som
  // fortsatt peker på en av dem migreres til nærmeste erstatning, ellers ville
  // de vist seg uten farge etter oppdateringen.
  var farge1=false;try{farge1=!!localStorage.getItem(SK+'_fargemigrert1');}catch(e){}
  if(!farge1){
    cats.forEach(function(c){
      if(c.color&&FJERNEDE_FARGER[c.color])c.color=FJERNEDE_FARGER[c.color];
    });
    try{localStorage.setItem(SK+'_fargemigrert1','1');}catch(e){}
    save();
  }

  // Oppnådde resultater manglet dato. Henter den fra et koblet prosjekt der den
  // finnes; ellers settes måneden resultatet selv var satt til, som beste anslag.
  var ad1=false;try{ad1=!!localStorage.getItem(SK+'_achieveddato1');}catch(e){}
  if(!ad1){
    results.forEach(function(r){
      if(!r.achieved||r.achievedDate)return;
      var pro=inventories.find(function(iv){
        return(iv.resultIds||[]).indexOf(r.id)>=0&&iv.completedDate;
      });
      if(pro){r.achievedDate=pro.completedDate;return;}
      if(r.year&&r.month)r.achievedDate=r.year+'-'+pad(r.month)+'-01';
    });
    try{localStorage.setItem(SK+'_achieveddato1','1');}catch(e){}
    save();
  }

  var prosjt1=false;try{prosjt1=!!localStorage.getItem(SK+'_prosjekttype1');}catch(e){}
  if(!prosjt1){
    inventories.forEach(function(iv){
      if((iv.type||'inventar')==='prosjekt'&&!iv.subtype)iv.subtype='annet';
    });
    results.forEach(function(r){
      if(!r.subtype)r.subtype='annet';
    });
    try{localStorage.setItem(SK+'_prosjekttype1','1');}catch(e){}
    save();
  }

  // Utemøbler med underkategorier
  var uts2=false;try{uts2=!!localStorage.getItem(SK+'_utstyr2');}catch(e){}
  if(!uts2){
    var ul=inventories.find(function(iv){return iv.fixed==='utstyr';});
    if(ul){
      ul.sections=ul.sections||[];
      [{id:'us_utemobler',name:'Utemøbler',parentId:''},
       {id:'us_ligge',name:'Liggemøbler',parentId:'us_utemobler'},
       {id:'us_sitte',name:'Sittemøbler',parentId:'us_utemobler'},
       {id:'us_sol',name:'Solskjerming',parentId:'us_utemobler'}].forEach(function(x){
        if(!ul.sections.some(function(sc){return sc.id===x.id;}))ul.sections.push({id:x.id,name:x.name,parentId:x.parentId});
      });
    }
    try{localStorage.setItem(SK+'_utstyr2','1');}catch(e){}
    save();
  }

  // Prioriteringer på innkjøpslista
  var ik1=false;try{ik1=!!localStorage.getItem(SK+'_innkjop1');}catch(e){}
  if(!ik1){
    var il=inventories.find(function(iv){return iv.fixed==='anskaffelser';});
    if(il){
      il.sections=il.sections||[];
      [{id:'ik_haster',name:'Haster'},{id:'ik_passer',name:'Ordnes når det passer'},{id:'ik_vent',name:'Satt på vent'}].forEach(function(x){
        if(!il.sections.some(function(sc){return sc.id===x.id;}))il.sections.push({id:x.id,name:x.name,parentId:''});
      });
      (il.items||[]).forEach(function(it){if(!it.sectionId)it.sectionId='ik_passer';});
    }
    try{localStorage.setItem(SK+'_innkjop1','1');}catch(e){}
    save();
  }

  // Antall på alle eksisterende punkter i lister som nå har antall
  var qtyAll=false;try{qtyAll=!!localStorage.getItem(SK+'_qtyall');}catch(e){}
  if(!qtyAll){
    inventories.forEach(function(iv){
      if((iv.type||'inventar')==='prosjekt')return;
      (iv.items||[]).forEach(function(it){
        it.values=it.values||{};
        if(!String(it.values.__qty||'').length){it.values.__qty='1';it.values.__unit=it.values.__unit||'stk';}
      });
    });
    try{localStorage.setItem(SK+'_qtyall','1');}catch(e){}
    save();
  }

  // Skille grupper fra personlige hashtagger. En tagg flere personer deler er
  // i praksis en gruppe — og nettopp den som lekket innlegg mellom folk som
  // ikke har noe med hverandre å gjøre. Tagger bare én person har, blir stående.
  var gr1=false;try{gr1=!!localStorage.getItem(SK+'_grupper1');}catch(e){}
  if(!gr1){
    var teller={};
    events.forEach(function(e){
      if(!e.bday)return;
      (e.personTags||[]).forEach(function(t){
        var k=normTag(t);if(!k)return;
        teller[k]=(teller[k]||0)+1;
      });
    });
    events.forEach(function(e){
      if(!e.bday)return;
      var pt=e.personTags||[];
      var delte=pt.filter(function(t){return teller[normTag(t)]>1;}).map(normTag);
      if(delte.length){
        e.groups=(e.groups||[]).concat(delte).filter(function(v,i,a){return a.indexOf(v)===i;});
        e.personTags=pt.filter(function(t){return teller[normTag(t)]<=1;});
      }
    });
    try{localStorage.setItem(SK+'_grupper1','1');}catch(e){}
    save();
  }

  // ── Sammenslåing av de to prosjektformene ──
  // Hvert frittstående resultat får et prosjekt som eier det. Resultatet blir
  // liggende som den lange beskrivelsen, med tid og penger; prosjektet blir det
  // du redigerer, og får faser, punktliste og typespesifikke felter.
  var slaa1=false;try{slaa1=!!localStorage.getItem(SK+'_slasammen1');}catch(e){}
  if(!slaa1){
    var eid={};
    inventories.forEach(function(iv){
      if((iv.type||'inventar')==='prosjekt')(iv.resultIds||[]).forEach(function(rid){eid[rid]=1;});
    });
    var antall=0;
    results.slice().forEach(function(r){
      if(eid[r.id])return;
      var sd=(r.startMonth&&r.startYear)?(r.startYear+'-'+pad(r.startMonth)+'-01'):'';
      var ed=(r.year&&r.month)?(r.year+'-'+pad(r.month)+'-'+pad(new Date(r.year,r.month,0).getDate())):'';
      var cat0=(r.subCats&&r.subCats.length)?r.subCats.slice():((goalById(r.valueId)||{}).cats||[]).slice();
      var nyttInv={
        id:'i'+Date.now()+Math.random().toString(36).slice(2,6)+antall,
        name:(r.shortTitle||'').trim()||r.name,
        type:'prosjekt',
        subtype:r.subtype||'annet',
        tags:[].concat(r.tags||[]),
        startDate:sd,endDate:ed,
        catId:cat0[0]||'',catIds:cat0,
        goalIds:r.valueId?[r.valueId]:[],
        resultIds:[r.id],
        eventIds:[].concat(r.eventIds||[]),
        equipmentIds:[].concat(r.equipmentIds||[]),
        hoursTotal:r.hoursTotal||'',
        trackHours:r.trackHours!==false,
        resources:'',
        completedDate:r.achieved?(ed||isoDate(today)):undefined,
        fields:[],sections:[],
        // Milepælene blir punkter på prosjektet, med dato og avhaking i behold
        items:(r.milestones||[]).map(function(m,i){
          return{id:'ii'+Date.now()+Math.random().toString(36).slice(2,4)+i,sectionId:null,
            name:m.name,note:'',date:m.date||'',inCal:!!m.date,values:{},have:!!m.done};
        })
      };
      inventories.push(nyttInv);
      r.milestones=[];
      antall++;
    });
    try{localStorage.setItem(SK+'_slasammen1','1');}catch(e){}
    if(antall)save();
  }

  // ── Resultater avvikles: alt flyttes inn i prosjektet ──
  // Prosjektet har nå kort navn og beskrivelse. Den gamle koblingen der et
  // prosjekt «eide» et resultat er kilden til dublettene, og fjernes helt.
  var res0=false;try{res0=!!localStorage.getItem(SK+'_ingenresultat1');}catch(e){}
  if(!res0){
    var brukt={};
    inventories.forEach(function(iv){
      if((iv.type||'inventar')!=='prosjekt')return;
      var rid=(iv.resultIds||[])[0];
      var r=rid?results.find(function(x){return x.id===rid;}):null;
      if(!r)return;
      brukt[r.id]=1;
      // Beskrivelsen er det gamle lange navnet
      if(!iv.description)iv.description=r.name||'';
      if(!iv.amountType)iv.amountType=r.amountType||'';
      if(!iv.targetAmount)iv.targetAmount=r.targetAmount||'';
      if(!iv.hoursMode)iv.hoursMode=r.hoursMode||'total';
      if(!iv.hoursTotal&&r.hoursTotal)iv.hoursTotal=r.hoursTotal;
      if(iv.trackHours===undefined)iv.trackHours=r.trackHours!==false;
      if(!iv.forutsetninger)iv.forutsetninger=r.forutsetninger||'';
      if(!iv.risikoer)iv.risikoer=r.risikoer||'';
      if(!(iv.routineIds||[]).length)iv.routineIds=[].concat(r.routineIds||[]);
      if(!(iv.tags||[]).length)iv.tags=[].concat(r.tags||[]);
      if(!iv.subtype)iv.subtype=r.subtype||'annet';
      // Milepæler som ennå ikke er flyttet
      if((r.milestones||[]).length){
        iv.items=(iv.items||[]).concat((r.milestones||[]).map(function(m,i){
          return{id:'ii'+Date.now()+Math.random().toString(36).slice(2,4)+i,sectionId:null,
            name:m.name,note:'',date:m.date||'',inCal:!!m.date,values:{},have:!!m.done};
        }));
      }
      delete iv.resultIds;
    });
    // Resultater uten prosjekt blir egne prosjekter
    results.filter(function(r){return!brukt[r.id];}).forEach(function(r,i){
      var sd=(r.startMonth&&r.startYear)?(r.startYear+'-'+pad(r.startMonth)+'-01'):'';
      var ed=(r.year&&r.month)?(r.year+'-'+pad(r.month)+'-'+pad(new Date(r.year,r.month,0).getDate())):'';
      var cat0=(r.subCats&&r.subCats.length)?r.subCats.slice():((goalById(r.valueId)||{}).cats||[]).slice();
      inventories.push({
        id:'i'+Date.now()+Math.random().toString(36).slice(2,6)+i,
        name:(r.shortTitle||'').trim()||r.name,
        description:r.name||'',
        type:'prosjekt',subtype:r.subtype||'annet',
        tags:[].concat(r.tags||[]),
        startDate:sd,endDate:ed,
        catId:cat0[0]||'',catIds:cat0,
        goalIds:r.valueId?[r.valueId]:[],
        eventIds:[].concat(r.eventIds||[]),
        routineIds:[].concat(r.routineIds||[]),
        equipmentIds:[].concat(r.equipmentIds||[]),
        amountType:r.amountType||'',targetAmount:r.targetAmount||'',
        hoursTotal:r.hoursTotal||'',hoursMode:r.hoursMode||'total',
        trackHours:r.trackHours!==false,
        forutsetninger:r.forutsetninger||'',risikoer:r.risikoer||'',
        completedDate:r.achieved?(ed||isoDate(today)):undefined,
        fields:[],sections:[],
        items:(r.milestones||[]).map(function(m,k){
          return{id:'ii'+Date.now()+Math.random().toString(36).slice(2,4)+k,sectionId:null,
            name:m.name,note:'',date:m.date||'',inCal:!!m.date,values:{},have:!!m.done};
        })
      });
    });
    results=[];
    try{localStorage.setItem(SK+'_ingenresultat1','1');}catch(e){}
    save();
  }

  // Rydd bort foreldreløse resultater som er dubletter av et prosjekts eget.
  // Kjøres hver gang, siden dubletter kan oppstå ved uheldige redigeringer.
  (function(){
    var eid={};
    inventories.forEach(function(iv){
      if((iv.type||'inventar')==='prosjekt')(iv.resultIds||[]).forEach(function(rid){eid[rid]=1;});
    });
    var eide=results.filter(function(r){return eid[r.id];});
    var foreldrelose=results.filter(function(r){return!eid[r.id];});
    var fjern={};
    foreldrelose.forEach(function(fr){
      // Samme grunnverdi og samme frist regnes som dublett — navnet kan ha
      // endret seg når prosjektets lange tittel ble redigert
      var lik=eide.some(function(er){
        return(er.valueId||'')===(fr.valueId||'')
          &&Number(er.month)===Number(fr.month)&&Number(er.year)===Number(fr.year);
      });
      if(lik)fjern[fr.id]=1;
    });
    var antFjernet=Object.keys(fjern).length;
    if(antFjernet){
      results=results.filter(function(r){return!fjern[r.id];});
      save();
    }
  })();

  // Sikring: alle faste lister skal finnes uansett hvilke migreringsflagg som
  // alt er satt. Uten denne blir nye lister aldri opprettet for dem som
  // allerede har kjørt en tidligere versjon — det var feilen med Garntyper.
  var FASTE_LISTER=[
    ['beredskap','Beredskap'],
    ['utstyr','Utstyr'],
    ['forbruksvarer','Forbruksvarer'],
    ['anskaffelser','Innkj\u00f8psliste'],
    ['garnlager','Garnlager'],
    ['garntyper','Garntyper'],
    ['strikkeoppskrifter','Strikkeoppskrifter'],
    ['strikkeutstyr','Strikkepinner og annet strikkeutstyr']
  ];
  var lagtTil=false;
  FASTE_LISTER.forEach(function(t){
    if(!inventories.some(function(iv){return iv.fixed===t[0];})){
      inventories.push({id:'fixed_'+t[0],name:t[1],type:'inventar',fixed:t[0],
        qty:t[0]!=='garntyper',catId:'',fields:[],sections:[],items:[]});
      lagtTil=true;
    }
  });
  if(lagtTil)save();
}

// Én felles hashtag-visning — trykker du på et stikkord noe sted i appen, havner du
// alltid her, og ser ALLE innlegg merket med det, uansett måned eller kategori.
// Det var nettopp fraværet av dette — flere ulike, sm\u00e5 filtreringer spredt utover
// forskjellige sider — som gjorde at innlegg kunne se ut som de manglet enkelte steder.
function goTagAlle(tag){view={kind:'tagalle',tag:tag};drawerOpen=false;render();}
// Mønsteranalyse for et stikkord: hva henger sammen med det, og er det faktisk
// uvanlig ofte — ikke bare mye, siden noe kan være mye brukt overalt uten at det
// sier noe spesielt om akkurat dette stikkordet. Styrke = andel blant de taggede
// innleggene delt på andel blant ALLE innlegg. 1 = helt vanlig. Over 1 = henger
// sammen oftere enn tilfeldig. Under 1 = sjeldnere enn ellers.
// Hvilke stikkord dukker oftest opp sammen med en person? Personen kan ha flere
// personlige hashtagger, så et treff er en del som inneholder minst én av dem.
// Regnes over deler, ikke innlegg — ellers ville «tur med Jenny, senere operaen
// med Knut» gjort operaen til noe Jenny var med på.
function personMonsterHTML(person){
  var pt=personTagsFor(person);
  if(!pt.length)return'';
  var alle=[];
  entries.forEach(function(e){bolkerFra(e).forEach(function(b){alle.push(b);});});
  var totalN=alle.length;
  var med=alle.filter(function(b){
    return(b.tags||[]).some(function(t){return pt.indexOf(normTag(t))>=0;});
  });
  if(med.length<3||totalN<8)return''; // for lite data til at et mønster sier noe

  var tellingMed={},tellingAlle={};
  alle.forEach(function(b){(b.tags||[]).forEach(function(t){tellingAlle[t]=(tellingAlle[t]||0)+1;});});
  med.forEach(function(b){(b.tags||[]).forEach(function(t){

  }).filter(function(x){return x.antall>=2;})

      return'<div class="entry-row tett"><div class="entry-body">'+tagPillHTML(x.navn)+'</div>'

        +(tekst?'<div style="font-size:11px;color:'+farge+'">'+tekst+'</div>':'')+'</div></div>';
    }).join('')
    +'</div>'
    +'<div class="hint" style="padding:0 12px 4px">Styrke sammenligner med hvor vanlig stikkordet er i hele dagboka, s\u00e5 noe du skriver mye om ellers ikke teller som s\u00e6rlig for '+esc(person)+'.</div>';
}
function tagMonsterHTML(tag){
  // Regnes over DELER, ikke innlegg. Skriver du «tur med Jenny» og «operaen med
  // Knut» i samme innlegg, hørte Jenny aldri til operaen — og med innlegget som
  // enhet ville analysen påstått at de gjorde det.
  var alle=[];
  entries.forEach(function(e){bolkerFra(e).forEach(function(b){alle.push(b);});});
  var totalN=alle.length;
  var tagget=alle.filter(function(b){return(b.tags||[]).includes(tag);});
  var taggetN=tagget.length;
  if(taggetN<3||totalN<8)return''; // for lite data til at et mønster sier noe

  function styrkeListe(hentFelt){
    var tellingTagget={},tellingAlle={};
    alle.forEach(function(e){(hentFelt(e)||[]).forEach(function(k){tellingAlle[k]=(tellingAlle[k]||0)+1;});});
    tagget.forEach(function(e){(hentFelt(e)||[]).forEach(function(k){if(k!==tag)tellingTagget[k]=(tellingTagget[k]||0)+1;});});
    return Object.keys(tellingTagget).map(function(k){
      var antall=tellingTagget[k];
      var andelTagget=antall/taggetN;
      var andelAlle=(tellingAlle[k]||0)/totalN;
      var styrke=andelAlle>0?andelTagget/andelAlle:null;
      return{navn:k,antall:antall,styrke:styrke};
    });
  }

  function styrkeRadHTML(navn,antall,styrke){
    var farge=styrke===null?'var(--muted)':(styrke>=1.5?'var(--red)':(styrke<0.7?'var(--muted)':'var(--ink)'));
    var tekst=styrke===null?'':(styrke>=1.05?'\u00d7'+styrke.toFixed(1)+' vanligere enn ellers':(styrke<=0.95?'\u00d7'+styrke.toFixed(1)+' \u2014 sjeldnere enn ellers':'omtrent som ellers'));
    return'<div class="entry-row tett"><div class="entry-body"><div class="entry-text" style="font-size:13px">'+esc(navn)+'</div></div>'
      +'<div style="text-align:right;flex-shrink:0"><div style="font-size:12px;color:var(--muted)">'+antall+' ganger</div>'
      +(tekst?'<div style="font-size:11px;color:'+farge+'">'+tekst+'</div>':'')+'</div></div>';
  }

  var tagStyrke=styrkeListe(function(e){return e.tags;})
    .filter(function(x){return x.antall>=2;})
    .sort(function(a,b){return(b.styrke||0)-(a.styrke||0);})
    .slice(0,8);
  var katStyrke=styrkeListe(function(e){return e.cats;})
    .map(function(x){var c=catById(x.navn);return{navn:c?c.name:x.navn,antall:x.antall,styrke:x.styrke};})
    .sort(function(a,b){return b.antall-a.antall;});

  var h='<div class="sec-title">Henger ofte sammen med</div>';
  if(!tagStyrke.length){
    h+='<div class="card"><div class="empty" style="padding:6px 12px">Ingen andre stikkord dukker opp nok ganger sammen med dette enn\u00e5.</div></div>';
  } else {
    h+='<div class="card">'+tagStyrke.map(function(x){return styrkeRadHTML('#'+x.navn,x.antall,x.styrke);}).join('')+'</div>';
  }
  h+='<div class="sec-title">Kategorier</div><div class="card">'
    +katStyrke.map(function(x){return styrkeRadHTML(x.navn,x.antall,x.styrke);}).join('')
    +'</div>'
    +'<div class="hint" style="padding:0 12px 4px">Styrke sammenligner med hvor vanlig noe er i hele dagboka \u2014 en kategori du bruker mye ellers vil ikke telle som spesiell her, selv om antallet er h\u00f8yt.</div>';
  return h;
}

  // Hendelser tas med, men ikke rutiner — en rutine du gjør flere ganger daglig

/* ── Rutine/hendelse-handlinger ── */
// ── Ankere ─────────────────────────────────────────────────────────────
// Et anker er noe du allerede gjør, som utløser rutinen. Enten en annen rutine
// (da vet appen når den skjer) eller fritekst for ting appen ikke kan vite noe
// om — «etter at deigen er satt til heving». En rutine kan ha flere.
// Form: {k:'r',id:'r123'} eller {k:'t',t:'etter morgenkaffen'}
function ankerTekst(a){
  if(!a)return'';
  if(a.k==='r'){var r=routineById(a.id);return r?r.name:'';}
  return a.t||'';
}
function routineById(id){return routines.find(function(r){return r.id===id;});}
// Rutiner som har denne som anker — brukes til å markere «nå er det din tur».
function rutinerAnkretTil(id){
  return routines.filter(function(r){
    return(r.ankere||[]).some(function(a){return a.k==='r'&&a.id===id;});
  });
}
// Hindrer at A ankres til B som er ankret til A. Uten dette kan to rutiner
// peke på hverandre, og «hva kommer først» blir uten svar.
function ankerGirSykel(rutineId,kandidatId){
  if(rutineId===kandidatId)return true;
  var sett={};
  var gaa=function(id){
    if(id===rutineId)return true;
    if(sett[id])return false;
    sett[id]=1;
    var r=routineById(id);if(!r)return false;
    return(r.ankere||[]).some(function(a){return a.k==='r'&&gaa(a.id);});
  };
  return gaa(kandidatId);
}
function ankerListeHTML(f){
  var ank=f.ankere||[];
  var h=ank.map(function(a,i){
    var t=ankerTekst(a);
    if(!t)return'';
    return'<button class="chip on" onclick="fjernAnker('+i+')">'
      +(a.k==='r'?'\u21ba ':'')+esc(t)+' \u2715</button>';
  }).join('');
  var brukte=ank.filter(function(a){return a.k==='r';}).map(function(a){return a.id;});
  var kand=routines.filter(function(r){
    return brukte.indexOf(r.id)<0&&!ankerGirSykel(f.id||'',r.id);
  }).sort(function(a,b){return nbSort(a.name,b.name);});
  h+='<div style="display:flex;gap:8px;margin-top:6px">'
    +'<input id="anker-inp" class="inp" type="text" style="flex:1" placeholder="F.eks. etter at deigen hever \u2026" value="'+esc(f._ankerInn||'')+'" oninput="mf()._ankerInn=this.value" onkeydown="if(event.key===\'Enter\'){event.preventDefault();leggTilAnkerTekst();}">'
    +'<button onclick="leggTilAnkerTekst()" style="padding:10px 14px;border-radius:10px;border:none;background:var(--btn);color:var(--red);font-size:16px;font-weight:700;cursor:pointer;flex-shrink:0">+</button>'
    +'</div>';
  if(kand.length){
    h+='<div class="hint" style="margin-top:8px">\u2026 eller etter en annen rutine:</div><div class="chips">'
      +kand.slice(0,12).map(function(r){
        return'<button class="chip" onclick="leggTilAnkerRutine(\''+q(r.id)+'\')">\u21ba '+esc(r.name)+'</button>';
      }).join('')+'</div>';
  }
  return h;
}
function leggTilAnkerTekst(){
  var f=mf();var t=String(f._ankerInn||'').trim();
  if(!t)return;
  f.ankere=[].concat(f.ankere||[],[{k:'t',t:t}]);

function leggTilAnkerRutine(id){
  var f=mf();
  if(ankerGirSykel(f.id||'',id))return;
  if((f.ankere||[]).some(function(a){return a.k==='r'&&a.id===id;}))return;
  f.ankere=[].concat(f.ankere||[],[{k:'r',id:id}]);
  render();
}
function fjernAnker(i){
  var f=mf();
  f.ankere=(f.ankere||[]).filter(function(_,j){return j!==i;});

}
// Vises under rutinenavnet: «etter Morgentur · etter at deigen hever»
function ankerLinjeTekst(r){
  // Rutineankere får «etter» foran; fritekst vises som skrevet, ellers blir det
  // «etter etter at deigen hever» for den som skriver hele setningen selv.
  var t=(r.ankere||[]).map(function(a){
    var n=ankerTekst(a);
    if(!n)return'';
    return a.k==='r'?('etter '+n):n;
  }).filter(Boolean);
  return t.join(' \u00b7 ');
}

function toggleRoutine(id,ym,minste){
  var r=routines.find(function(x){return x.id===id;});if(!r)return;
  r.log=r.log||[];r.minsteLog=r.minsteLog||[];
  var wasOn=r.log.includes(ym);
  r.log=wasOn?r.log.filter(function(l){return l!==ym;}):[].concat(r.log,[ym]);
  // Minsteversjonen teller som gjort. Den registreres i samme logg, slik at
  // «11 av 14» ikke får hull i en dårlig uke, men merkes så det er mulig å se
  // forskjell på en full og en minimal dag.
  if(wasOn)r.minsteLog=r.minsteLog.filter(function(l){return l!==ym;});
  else if(minste)r.minsteLog=[].concat(r.minsteLog,[ym]);
  if(!wasOn&&(r.equipmentIds||[]).length)markEquipmentUsed(r.equipmentIds,r.name+' '+fmtDate(isoDate(today)));
  checkRoutineMilestone(r);
  save();render();
}
function toggleEvent(id,year){
  var e=events.find(function(x){return x.id===id;});if(!e)return;
  if(e.repeat){
    year=Number(year)||curYear;
    e.log=e.log||[];
    var wasOn=e.log.includes(year);
    e.log=wasOn?e.log.filter(function(y){return y!==year;}):[].concat(e.log,[year]);
    // Bursdag: hold bursdagshilsen i takt med Gratulert
    if(e.bday){
      var greeted=evDone(e,year);
      var hasGreet=greetDone(e.name,year,'bursdag');
      if(greeted&&!hasGreet)toggleGreet(e.name,year,'bursdag');
      else if(!greeted&&hasGreet)toggleGreet(e.name,year,'bursdag');
    }
    if(!wasOn&&(e.equipmentIds||[]).length)markEquipmentUsed(e.equipmentIds,e.name+' '+MND_FULL[e.month-1]+' '+year);
  } else {
    e.done=!e.done;
    if(e.done&&(e.equipmentIds||[]).length)markEquipmentUsed(e.equipmentIds,e.name+' '+MND_FULL[e.month-1]+' '+e.year);
  }
  save();render();
}
function daysToNextBday(e){
  var now=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  var next=new Date(curYear,e.month-1,e.day||1);
  if(next<now)next=new Date(curYear+1,e.month-1,e.day||1);
  return Math.round((next-now)/86400000);
}
function ageToday(e){
  var s=Number(e.sinceYear);if(!(s>0))return null;
  var had=(e.month<curMonth)||(e.month===curMonth&&(e.day||31)<=today.getDate());
  return(had?curYear:curYear-1)-s;
}

function evOccYearOk(e,Y){
  if(!e.repeat)return Number(e.year)===Y;
  var st=Number(e.year);if(Y<st)return false;
  return(Y-st)%(Number(e.interval)||1)===0;
}
function eventsOnDate(dm,dd,dy){
  var out=[];
  var target=new Date(dy,dm-1,dd).getTime();
  events.forEach(function(e){
    if(!e.day)return;
    [dy,dy-1].forEach(function(Y){
      if(!evOccYearOk(e,Y))return;
      var start=new Date(Y,e.month-1,e.day);
      var end=start;
      if(e.toDay){
        var wraps=(e.toMonth<e.month)||(e.toMonth===e.month&&e.toDay<e.day);
        end=new Date(Y+(wraps?1:0),e.toMonth-1,e.toDay);
      }
      if(target>=start.getTime()&&target<=end.getTime()){
        if(!out.some(function(o){return o.e.id===e.id&&o.occYear===Y;}))
          out.push({e:e,occYear:Y,isStart:target===start.getTime(),isEnd:target===end.getTime()});
      }
    });
  });
  return out;
}
function evSpanTxt(e){
  if(!e.toDay)return'';
  return e.day+'. '+MND_FULL[e.month-1].slice(0,3)+' \u2013 '+e.toDay+'. '+MND_FULL[e.toMonth-1].slice(0,3);

function evFreqTxt(e){
  if(!e.repeat)return'';
  var iv=Number(e.interval)||1;
  return iv===1?'hvert \u00e5r':'hvert '+iv+'. \u00e5r';
}
function evDone(e,year){return e.repeat?(e.log||[]).includes(Number(year)):!!e.done;}
function eventIsPast(e){
  if(e.repeat)return false;
  var y=Number(e.year),m=Number(e.month),d=e.day?Number(e.day):null;
  var end;
  if(d){
    if(e.toDay){
      var wraps=(e.toMonth<m)||(e.toMonth===m&&e.toDay<d);
      end=new Date(y+(wraps?1:0),e.toMonth-1,e.toDay,23,59,59);
    } else {
      end=new Date(y,m-1,d,23,59,59);
    }
  } else {
    end=new Date(y,m,0,23,59,59);
  }
  return end.getTime()<today.getTime();
}
function evYears(e,y){var s=Number(e.sinceYear);return s>0&&y-s>0?y-s:null;}

function resultDeadlineHTML(r){

// Faste kvartaler. Regner ut om planen for de neste tre m\u00e5nedene g\u00e5r opp,
// og lar deg prioritere direkte derfra.
var kvartalNotat={};
function kvartalNaa(d){d=d||today;return{y:d.getFullYear(),q:Math.floor(d.getMonth()/3)+1};}
function kvartalMaaneder(y,q){var s=(q-1)*3+1;return[s,s+1,s+2];}
function kvartalNavn(q){return['1. kvartal (jan\u2013mar)','2. kvartal (apr\u2013jun)','3. kvartal (jul\u2013sep)','4. kvartal (okt\u2013des)'][q-1];}
function kvartalNokkel(y,q){return y+'-Q'+q;}
// Er vi i de f\u00f8rste dagene av et nytt kvartal, og planleggingen ikke gjort?
function kvartalTrengsNaa(){
  var k=kvartalNaa();
  var m=today.getMonth()+1;
  var erFørsteMnd=(m-1)%3===0;
  if(!erFørsteMnd||today.getDate()>14)return null;
  var n=kvartalNokkel(k.y,k.q);
  return(kvartalNotat[n]&&kvartalNotat[n].ferdig)?null:k;
}
function goKvartal(y,q){
  var k=kvartalNaa();
  view={kind:'kvartal',y:y||k.y,q:q||k.q};drawerOpen=false;render();
}
// Timer et prosjekt trenger i kvartalet, gitt frist og gjenst\u00e5ende arbeid
function kvartalTimerFor(it,y,q){
  if(!it.trackHours)return 0;
  var mnd=kvartalMaaneder(y,q);
  if(it.hoursMode==='monthly')return(Number(it.hoursTotal)||0)*3;
  var dl=itemDeadlineYM(it);
  if(!dl)return 0;
  var dlYM=dl.year*12+(dl.month-1);
  var startYM=y*12+(mnd[0]-1);
  var sluttYM=y*12+(mnd[2]-1);
  if(dlYM<startYM)return 0; // fristen har passert
  var brukt=hoursFor(it.kind,it.refId,null,null,'\u00e5r');
  var igjen=Math.max(0,(Number(it.hoursTotal)||0)-brukt);
  if(!igjen)return 0;
  var todayYM=today.getFullYear()*12+today.getMonth();
  var fraYM=Math.max(startYM,todayYM);
  var mndIgjen=Math.max(1,dlYM-fraYM+1);
  var mndIKvartal=Math.max(0,Math.min(sluttYM,dlYM)-fraYM+1);
  return Math.round(igjen/mndIgjen*mndIKvartal*10)/10;
}
function kvartalRutinetimer(y,q){
  var sum=0;
  kvartalMaaneder(y,q).forEach(function(m){
    routines.forEach(function(r){
      if(!r.trackHours)return;
      sum+=routineExpectedHours(r,y,m,'m\u00e5ned')||0;
    });
  });
  return Math.round(sum*10)/10;
}

       +(diff<0?'<div style="font-size:11.5px;color:var(--red);margin-top:6px">Planen g\u00e5r ikke opp. Utsett noe under, eller juster timene.</div>':'')
      :'<div class="hint">Legg inn tilgjengelig tid per uke under Tid og penger for \u00e5 se om planen g\u00e5r opp.</div>')

  if(poster.length){

      var r=it.moneyRes;var b=Number(r.targetAmount)||0;

function invPickDrillInto(id){var f=mf();f._pickDrill=(f._pickDrill||[]).concat([id]);render();}

function itemOnList(item,targetInv){
  if(!item.syncId)return null;
  return(targetInv.items||[]).find(function(x){return x.syncId===item.syncId;})||null;
}
function toggleItemOnList(invId,itemId,targetInvId){
  var inv=invById(invId);var target=invById(targetInvId);if(!inv||!target)return;
  var it=(inv.items||[]).find(function(x){return x.id===itemId;});if(!it)return;
  if(!it.syncId)it.syncId=it.id;
  var existing=itemOnList(it,target);
  if(existing){
    target.items=(target.items||[]).filter(function(x){return x.id!==existing.id;});
  } else {
    var values={};
    (target.fields||[]).forEach(function(tf){
      var srcField=(inv.fields||[]).find(function(sf){return sf.name.toLowerCase()===tf.name.toLowerCase();});
      if(srcField&&(it.values||{})[srcField.id])values[tf.id]=it.values[srcField.id];
    });
    var srcVals=it.values||{};
    if(listHasQty(target)&&srcVals.__qty){values.__qty=srcVals.__qty;if(srcVals.__unit)values.__unit=srcVals.__unit;}
    if(srcVals.__farge)values.__farge=srcVals.__farge;
    if(srcVals.__merke)values.__merke=srcVals.__merke;
    if(srcVals.__tilstand)values.__tilstand=srcVals.__tilstand;
    if(listHasDetails(target)&&srcVals.__kjopt)values.__kjopt=srcVals.__kjopt;
    if(listHasExp(target)&&srcVals.__exp)values.__exp=srcVals.__exp;
    target.items=(target.items||[]).concat([{
      id:'ii'+Date.now()+Math.random().toString(36).slice(2,6),
      sectionId:null,name:it.name,note:it.note||'',values:values,have:(target.type||'inventar')==='pakke'?false:!!it.have,
      syncId:it.syncId
    }]);
  }
  save();render();
}

// ── Kanban ──
// Fire faser. Ferdigstilt speiler completedDate, så tavla og resten av appen
// alltid er enige om hva som er ferdig. Ideer har ingen timebegrensning — det er
// før noe i det hele tatt er bestemt.
var KANBAN_FASER=[['ide','Ideer'],['plan','Planlegging'],['arbeid','Gjennomf\u00f8ring'],['ferdig','Ferdigstilt']];
// Hvilke faser som er slått ut. Ideer starter kollapset — det er greit å ikke
// se hele idelista hele tiden — de tre andre starter åpne.
var kanbanApen={ide:false,plan:true,arbeid:true,ferdig:false};
function toggleKanbanFase(id){kanbanApen[id]=!kanbanApen[id];render();}
var kanbanTakPlan=5,kanbanTakArbeid=15;
function kanbanFase(iv){
  if(iv.completedDate)return'ferdig';
  return iv.fase||'plan'; // gamle prosjekter uten fase havner i Planlegging, ikke Ideer
}
function kanbanFlytt(invId,retning){
  var iv=invById(invId);if(!iv)return;
  var naa=kanbanFase(iv);
  var i=KANBAN_FASER.findIndex(function(f){return f[0]===naa;});
  var ny=KANBAN_FASER[Math.max(0,Math.min(3,i+retning))];
  if(!ny||ny[0]===naa)return;
  if(ny[0]==='ferdig'){toggleProjectDone(invId);return;} // gir feiring og setter dato
  if(naa==='ferdig'){delete iv.completedDate;(iv.resultIds||[]).forEach(function(rid){settResultatOppnadd(resultById(rid),false);});}
  iv.fase=ny[0];
  save();render();
}
// Timer denne uka, logget på prosjekter som står i en gitt fase å nå.
// Bruker den vanlige timeføringen — ingen egen timeklokke per aktivitet.
function kanbanUkeTimer(fase){
  var mand=isoDate(mondayOf(today));
  var sond=new Date(mondayOf(today));sond.setDate(sond.getDate()+6);
  var sondIso=isoDate(sond);
  var iProsjekter=inventories.filter(function(iv){return(iv.type||'inventar')==='prosjekt'&&kanbanFase(iv)===fase;});
  var sum=0;
  timeLogs.forEach(function(t){
    if(t.kind!=='proj')return;
    if(!(t.date>=mand&&t.date<=sondIso))return;
    if(iProsjekter.some(function(iv){return iv.id===t.refId;}))sum+=Number(t.hours)||0;
  });
  return Math.round(sum*10)/10;
}
function kanbanSettTak(fase,v){
  var n=Math.max(0,Number(v)||0);
  if(fase==='plan')kanbanTakPlan=n;else kanbanTakArbeid=n;
  save();render();
}
// Aktiviteter på et prosjekt kan høre til planleggingsfasen eller gjennomføringsfasen
// Timer som gjenst\u00e5r p\u00e5 et prosjekt \u2014 vises p\u00e5 kortet
// ── Oppgaver på et prosjekt ──
// Enklere enn milepæler: ingen dato, ingen fanfare, bare noe å hake av.
// Delt på plan/gjennomføring — når alt i fasen er avhaket, er prosjektet klart til å flyttes.
function oppgaverForFase(iv,fase){
  return(iv.oppgaver||[]).filter(function(o){return o.fase===fase;});
}
function oppgaveTimerIgjen(iv,fase){
  var sum=oppgaverForFase(iv,fase).filter(function(o){return!o.ferdig;})
    .reduce(function(a,o){return a+(Number(o.timer)||0);},0);
  return Math.round(sum*10)/10;
}
function faseKlar(iv,fase){
  var o=oppgaverForFase(iv,fase);
  return o.length>0&&o.every(function(x){return x.ferdig;});
}
function toggleOppgave(invId,oppgaveId){
  var iv=invById(invId);if(!iv)return;
  var o=(iv.oppgaver||[]).find(function(x){return x.id===oppgaveId;});if(!o)return;

}
function openOppgaveModal(invId,fase){modal={step:'oppgave',form:{invId:invId,fase:fase,navn:'',timer:''}};render();}
function deleteOppgave(invId,oppgaveId){
  var iv=invById(invId);if(!iv)return;
  iv.oppgaver=(iv.oppgaver||[]).filter(function(x){return x.id!==oppgaveId;});

}
function submitOppgave(){

function kanbanTimerIgjen(iv){
  if(!iv.trackHours)return null;
  var tot=Number(iv.hoursTotal)||0;
  if(!tot)return null;

function kanbanTavleHTML(){
  var alle=inventories.filter(function(iv){return(iv.type||'inventar')==='prosjekt';});
  var h='';

  // Ukenummer og datoer først — så det er tydelig hvilken uke kapasitetstallene
  // under faktisk gjelder for, før man i det hele tatt ser på prosjektene.
  var man=mondayOf(today),son=new Date(man);son.setDate(man.getDate()+6);
  var kortDato=function(d){return d.getDate()+'. '+MND_FULL[d.getMonth()];};

    +'<div style="font-size:20px;font-weight:700;color:var(--red)">Uke '+weekNum(today)+'</div>'

  // Ukens timer mot taket, for de to fasene som faktisk har et tak
  [['plan','Planlegging',kanbanTakPlan],['arbeid','Gjennomf\u00f8ring',kanbanTakArbeid]].forEach(function(t){
    var brukt=kanbanUkeTimer(t[0]);

    h+='<div class="card" style="padding:8px 14px;margin-bottom:4px">'

      +'<span style="flex:1">'+t[1]+' denne uka \u2013 h\u00f8yst <input class="inp" type="text" inputmode="numeric" style="width:40px;display:inline-block;margin:0 4px;padding:2px 4px;text-align:right" value="'+esc(String(tak))+'" oninput="this.value=this.value.replace(/[^0-9]/g,\'\')" onchange="kanbanSettTak(\''+t[0]+'\',this.value)"> t/uke</span>'
      +'<b style="color:'+(brukt>tak?'var(--red)':'var(--ink)')+'">'+String(brukt).replace('.',',')+' / '+tak+' t</b>'
      +'</div></div>';

  // Fargeflate bak fasene: bare Ideer beholder sin lyse bakgrunn. Ferdigstilt

  var farger={ide:'#F2E9D8',plan:'',arbeid:'',ferdig:''};
  h+='<div style="padding:4px 8px 0">';
  KANBAN_FASER.forEach(function(f,fi){
    var iFase=alle.filter(function(iv){return kanbanFase(iv)===f[0];})
      .sort(function(a,b){return nbSort(dispName(a),dispName(b));});
    var apen=!!kanbanApen[f[0]];
    var erFerdig=f[0]==='ferdig';
    h+='<div style="background:'+(farger[f[0]]||'transparent')+';border-radius:10px;padding:2px;margin-bottom:6px">'
      +'<div style="display:flex;align-items:center;gap:6px;padding:8px 6px;cursor:pointer" onclick="toggleKanbanFase(\''+f[0]+'\')">'
      +'<span class="s-arrow'+(apen?' open':'')+'" style="font-size:11px">\u25b6\ufe0e</span>'
      +'<span style="flex:1;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--grp)">'
      +f[1]+' <span style="font-weight:400;color:var(--rose)">'+iFase.length+'</span></span>'
      +'</div>';
    if(apen){
    if(!iFase.length){
      h+='<div style="font-size:11px;color:var(--muted);padding:0 10px 10px">\u2013</div>';
    }
    // Ideer får en dempet, mørk gråbrun tekst i stedet for full svart — det er
    // fasen der ingenting krever like mye oppmerksomhet akkurat nå. Ferdigstilt
    // får grå, kursiv tekst — unnagjort, ikke noe å legge vekt på lenger.
    var demp=f[0]==='ide'?'#7A7166':'var(--ink)';
    iFase.forEach(function(iv){
      var col=catColor((iv.catIds&&iv.catIds[0])||iv.catId)||'var(--line)';
      var t=kanbanTimerIgjen(iv);
      var frist=iv.endDate?fmtDate(iv.endDate):'';
      var forsinket=iv.endDate&&!iv.completedDate&&iv.endDate<isoDate(today);
      h+='<div style="background:var(--card);border:1px solid var(--line);border-left:3px solid '+col+';border-radius:8px;padding:6px 7px;margin:0 4px 5px'+(erFerdig?';font-style:italic':'')+'">'
        +'<div style="font-size:11.5px;font-weight:700;line-height:1.25;cursor:pointer;color:'+(erFerdig?'var(--muted)':demp)+'" onclick="goInventar(\''+q(iv.id)+'\')">'+esc(dispName(iv))+'</div>'
        +(t!==null?'<div style="font-size:10px;color:var(--muted);margin-top:2px">'+String(t).replace('.',',')+' t igjen</div>':'')

// Full samkjøring med Kanban-tavla: samme faser, samme oppgaver — bare med mer plass

function prosjektFaseHTML(iv){

    +(i>0?'<button class="icon-btn" style="font-size:11px" onclick="kanbanFlytt(\''+q(iv.id)+'\',-1)">\u2039 forrige</button>':'')
    +(i<3?'<button class="icon-btn" style="font-size:11px" onclick="kanbanFlytt(\''+q(iv.id)+'\',1)">neste \u203a</button>':'')

  var alleOppgaver=iv.oppgaver||[];
  var anslagTotalt=alleOppgaver.reduce(function(a,o){return a+(Number(o.timer)||0);},0);
  var loggetTotalt=timeLogs.filter(function(t){return t.kind==='proj'&&t.refId===iv.id;})
    .reduce(function(a,t){return a+(Number(t.hours)||0);},0);
  if(anslagTotalt||loggetTotalt){

    h+='<div class="card" style="padding:8px 12px;margin-top:8px;background:var(--bg)">'
      +'<div style="display:flex;gap:14px">'
      +'<div><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em">Anslått</div><div style="font-size:15px;font-weight:700">'+(anslagTotalt?String(Math.round(anslagTotalt*10)/10).replace('.',',')+' t':'\u2013')+'</div></div>'
      +'<div><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em">Loggf\u00f8rt</div><div style="font-size:15px;font-weight:700">'+(loggetTotalt?String(Math.round(loggetTotalt*10)/10).replace('.',',')+' t':'\u2013')+'</div></div>'
      +(anslagTotalt&&loggetTotalt?'<div><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em">Differanse</div><div style="font-size:15px;font-weight:700;color:'+(diff<=0?'#4E7B5C':'var(--red)')+'">'+(diff>0?'+':'')+String(Math.round(diff*10)/10).replace('.',',')+' t</div></div>':'')
      +'</div></div>';
  }
  ['plan','arbeid'].forEach(function(fa){
    var opp=oppgaverForFase(iv,fa);
    var tIgjen=oppgaveTimerIgjen(iv,fa);
    var klar=faseKlar(iv,fa);
    h+='<div style="margin-top:10px">'
      +'<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--grp)">'
      +(fa==='plan'?'Planlegging':'Gjennomf\u00f8ring')+(fase===fa?' <span style="font-weight:400;color:var(--rose);text-transform:none;letter-spacing:0">\u00b7 n\u00e5v\u00e6rende fase</span>':'')
      +'</div>';
    if(opp.length){
      h+=opp.map(function(o){
        return'<div style="display:flex;align-items:flex-start;gap:6px;font-size:13px;padding:3px 0;cursor:pointer" onclick="toggleOppgave(\''+q(iv.id)+'\',\''+q(o.id)+'\')">'
          +'<span style="flex-shrink:0">'+(o.ferdig?'\u2611':'\u2610')+'</span>'
          +'<span style="flex:1;'+(o.ferdig?'text-decoration:line-through;color:var(--muted)':'')+'">'+esc(o.navn)+(o.timer?' <span style="color:var(--muted)">('+String(o.timer).replace('.',',')+'t)</span>':'')+'</span>'
          +'<button class="icon-btn" style="font-size:10px;flex-shrink:0" onclick="event.stopPropagation();deleteOppgave(\''+q(iv.id)+'\',\''+q(o.id)+'\')">\u00d7</button>'
          +'</div>';
      }).join('');
    } else {
      h+='<div style="font-size:12px;color:var(--muted);padding:3px 0">Ingen oppgaver enn\u00e5.</div>';
    }
    if(tIgjen)h+='<div style="font-size:11px;color:var(--muted);margin-top:2px">'+String(tIgjen).replace('.',',')+' t igjen i fasen</div>';
    if(klar)h+='<div style="font-size:11.5px;font-weight:700;color:#4E7B5C;margin-top:3px">\u2713 Klar for '+(fa==='plan'?'gjennomf\u00f8ring':'ferdigstilling')+'</div>';
    h+='<button class="icon-btn" style="font-size:11px;margin-top:4px" onclick="openOppgaveModal(\''+q(iv.id)+'\',\''+fa+'\')">+ oppgave</button>'
      +'</div>';
  });
  return h+'</div>';

/* ── Syklus: registrering, dagsdetaljer og grafer ── */
function mensLyn(n){return Array(Math.max(0,(Number(n)||0)-1)).fill('\u26a1').join('');}
function mensDraaper(n){return Array(Number(n)||0).fill('\ud83e\ude78').join('');}
function mensSettSlim(dato){
  var rad=mensDagFor(dato);
  if(!rad){rad={date:dato,energi:'',fokus:'',intensity:'',smerte:'',slim:false};mensDag.push(rad);}
  rad.slim=!rad.slim;
  if(!rad.energi&&!rad.fokus&&!rad.intensity&&!rad.smerte&&!rad.slim)mensDag=mensDag.filter(function(x){return x!==rad;});
  save();render();
}
function mensSettSlutt(dato){
  var per=mensPeriodeFor(dato);if(!per)return;
  per.end=(per.end===dato)?'':dato;
  save();render();
}
function mensStartNy(dato){
  mens.push({id:'ms'+Date.now()+Math.random().toString(36).slice(2,6),start:dato,end:'',note:''});
  save();render();
}

      }).join('')

  h+='</table>'
    +'<div class="hint" style="margin-top:2px">1 = ingen/lavest \u2192 4 = kraftig/h\u00f8yest</div>';
  return h;

function mensDagMerkerHTML(dato,tittel){

function mensSykluser(){
  var starter=mens.slice().sort(function(a,b){return a.start<b.start?-1:1;}).map(function(m){return m.start;});
  var ut=[];
  for(var i=0;i<starter.length;i++){
    var start=starter[i];
    var erSiste=(i===starter.length-1);
    var lengde=erSiste
      ? Math.round((new Date(isoDate(today)+'T00:00:00')-new Date(start+'T00:00:00'))/86400000)+1
      : Math.round((new Date(starter[i+1]+'T00:00:00')-new Date(start+'T00:00:00'))/86400000);
    ut.push({start:start,lengde:Math.max(1,lengde),pagaende:erSiste});
  }
  return ut.reverse(); // nyeste f\u00f8rst
}
function mensSyklusPunkter(syklus,felt){
  var start=new Date(syklus.start+'T00:00:00');
  var ut=[];
  mensDag.forEach(function(r){
    var d=Math.round((new Date(r.date+'T00:00:00')-start)/86400000)+1;
    if(d<1||d>syklus.lengde)return;
    var v=null;
    if(felt==='energi')v=r.energi?Number(r.energi):null;
    else if(felt==='fokus')v=r.fokus?Number(r.fokus):null;
    else if(felt==='intensity')v=r.intensity?Number(r.intensity):null;
    else if(felt==='smerte')v=r.smerte?Number(r.smerte):null;
    else if(felt==='hodepine')v=r.hodepine?Number(r.hodepine):null;
    else if(felt==='hud')v=r.hud?Number(r.hud):null;
    else if(felt==='oppblaast')v=r.oppblaast?Number(r.oppblaast):null;
    else if(felt==='korsrygg')v=r.korsrygg?Number(r.korsrygg):null;
    else if(felt==='nakke')v=r.nakke?Number(r.nakke):null;
    else if(felt==='kvalme')v=r.kvalme?Number(r.kvalme):null;
    if(v!==null)ut.push({dag:d,verdi:v});
  });
  return ut.sort(function(a,b){return a.dag-b.dag;});
}
function mensSyklusSlimDager(syklus){
  var start=new Date(syklus.start+'T00:00:00');
  var ut=[];
  mensDag.forEach(function(r){
    if(!r.slim)return;
    var d=Math.round((new Date(r.date+'T00:00:00')-start)/86400000)+1;
    if(d>=1&&d<=syklus.lengde)ut.push(d);
  });
  return ut;
}
function mensSyklusKombinertGrafSVG(syk){
  var serier=[
    ['intensity','Bl\u00f8dning'],
    ['energi','Energi'],
    ['smerte','Menssmerter'],
    ['hodepine','Hodepine'],
    ['fokus','Konsentrasjon'],
    ['hud','Uren hud'],
    ['oppblaast','Oppbl\u00e5sthet'],
    ['korsrygg','Korsryggsmerter'],
    ['nakke','Skulder-/nakkesmerter'],
    ['kvalme','Kvalme']
  ].filter(function(t){return t[0]==='intensity'||mensGrafSynlig[t[0]]!==false;})
   .map(function(t){return{felt:t[0],navn:t[1],farge:MENS_GRAF_FARGER[t[0]],punkter:mensSyklusPunkter(syk,t[0])};});
  var slimDager=mensGrafSynlig.slim!==false?mensSyklusSlimDager(syk):[];
  var noe=serier.some(function(s){return s.punkter.length;})||slimDager.length;
  if(!noe)return'<div class="empty" style="font-size:11px;padding:6px 0">Ingen data denne syklusen \u2014 eller alt er skrudd av under.</div>';
  var W=320,H=140,ML=6,MR=6,MT=16,MB=6,plotW=W-ML-MR,plotH=H-MT-MB;
  var lengde=syk.lengde;
  var xFor=function(d){return lengde>1?ML+plotW*((d-1)/(lengde-1)):ML+plotW/2;};
  var yFor=function(v){return MT+plotH-(v-1)/3*plotH;}; // skala 1–4
  var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:140px;display:block">';
  // Syklusdag over hver eneste dag, i liten skrift
  for(var d=1;d<=lengde;d++){
    svg+='<text x="'+xFor(d)+'" y="10" text-anchor="middle" style="font-size:6px;fill:var(--muted)">'+d+'</text>';
  }
  // Eggl\u00f8sningsslim som lysegr\u00f8nne s\u00f8yler bak alt annet
  var barW=lengde>1?Math.max(2,plotW/lengde*0.7):8;
  slimDager.forEach(function(d){
    svg+='<rect x="'+(xFor(d)-barW/2)+'" y="'+MT+'" width="'+barW+'" height="'+plotH+'" style="fill:#C9E3B8;opacity:.65"/>';
  });
  // Frittst\u00e5ende s\u00f8yler per registrering, i stedet for sammenhengende linjer —
  // en linje ville antydet en jevn bevegelse ogs\u00e5 gjennom dagene du ikke registrerte
  // noe, og den dataen finnes ikke. Litt forskyvning per serie s\u00e5 flere symptomer
  // registrert samme dag ikke havner helt oppå hverandre.
  var baseline=yFor(1);
  var barBredde=1.4;
  var forskyvSteg=1.7;
  serier.forEach(function(s,si){
    var forskyv=(si-(serier.length-1)/2)*forskyvSteg;
    s.punkter.forEach(function(p){
      if(p.verdi<=1)return; // «Ingen» skal ikke gi noe synlig utslag
      var x=xFor(p.dag)+forskyv;
      var y=yFor(p.verdi);
      svg+='<rect x="'+(x-barBredde/2)+'" y="'+y+'" width="'+barBredde+'" height="'+(baseline-y)+'" rx="0.7" style="fill:'+s.farge+'"/>';
    });
  });
  svg+='</svg>';
  var forklaring='<div style="display:flex;flex-wrap:wrap;gap:8px 12px;padding:2px 2px 0;font-size:10px;color:var(--muted)">'
    +serier.map(function(s){
      return'<span><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+s.farge+';margin-right:3px;vertical-align:middle"></span>'+s.navn+'</span>';
    }).join('')
    +(mensGrafSynlig.slim!==false?'<span><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:#C9E3B8;margin-right:3px;vertical-align:middle"></span>Eggl\u00f8sningsslim</span>':'')
    +'</div>';
  return svg+forklaring;
}

      +'<div class="hint">Bl\u00f8dning vises alltid.</div>'
      +'</div>';
    h+='<div class="card" style="padding:8px 10px">'
      +'<div style="font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px">Merknad om denne syklusen</div>'
      +'<textarea class="inp" rows="2" style="margin:0" placeholder="F.eks. noe som p\u00e5virket denne syklusen spesielt \u2026" oninput="mensSyklusSettNotat(\''+syk.start+'\',this.value)">'+esc(mensSyklusNotat[syk.start]||'')+'</textarea>'
      +'</div>';
  }
  return h;
}

function itemDeadlineYM(it){
  if(it.kind==='proj'){

// Dynamisk anbefaling: gjenstående timer fordelt på månedene som er igjen til fristen, regnet fra i dag —
// erstatter et fast «forventet denne måneden»-tall som uansett ville vært en gjetning.
function recommendedPaceHours(it){
  if(it.hoursMode==='monthly')return null;
  if(!it.hoursTotal)return null;
  var dl=itemDeadlineYM(it);if(!dl)return null;
  var todayYM=today.getFullYear()*12+today.getMonth();
  var dlYM=dl.year*12+(dl.month-1);
  var monthsLeft=Math.max(1,dlYM-todayYM+1);
  var used=hoursFor(it.kind,it.refId,null,null,'\u00e5r');
  var remaining=Number(it.hoursTotal)-used;
  if(remaining<=0)return 0;
  return Math.round(remaining/monthsLeft*10)/10;
}

function itemMilestonesInPeriod(it,y,m,scope){

    (iv&&iv.items||[]).forEach(function(x){if(inPer(x.date))list.push({name:x.name,done:!!x.have});});
  }
  var r=it.moneyRes;

function itemStartedByPeriod(it,y,m,scope){

  } else {

  }
  if(!sd)return true;
  var startYM=Number(sd.slice(0,4))*12+(Number(sd.slice(5,7))-1);
  var periodYM=scope==='m'?(y*12+(m-1)):(y*12+11);
  return startYM<=periodYM;
}
// Forventet tidsbruk for en rutine i en gitt periode — grovt anslag ut fra frekvens, ikke et fasitsvar
function routineExpectedHours(r,y,m,scope){
  var min=Number(r.minutes)||0;if(!min)return 0;
  var monthOk=function(mo){return!(r.months&&r.months.length)||r.months.indexOf(mo)>=0;};
  if(scope==='m'){
    if(!monthOk(m))return 0;
    if(r.freq==='yearly')return 0;
    if(r.freq==='daily'){
      var dim=new Date(y,m,0).getDate();var validDays=0;
      for(var d=1;d<=dim;d++){
        var dow=new Date(y,m-1,d).getDay();
        if(!(r.days&&r.days.length)||r.days.indexOf(dow)>=0)validDays++;
      }
      return Math.round(validDays*min/60*10)/10;
    }
    if(isWeekly(r)){
      var weeksInMonth=4.345/((r.freq==='odd'||r.freq==='even')?2:1);
      return Math.round(weeksInMonth*(Number(r.perWeek)||1)*min/60*10)/10;
    }
    return Math.round(min/60*10)/10; // «månedlig» rutine: én gang per aktuell måned
  }
  var total=0;
  for(var mm=1;mm<=12;mm++)total+=routineExpectedHours(r,y,mm,'m');
  if(r.freq==='yearly'&&monthOk(1))total+=min/60;
  return Math.round(total*10)/10;
}

}

// ── Forslag til rutinekobling ──────────────────────────────────────────
// Koblingen mellom innlegg og rutine finnes allerede, men krever at du husker
// den i det ene øyeblikket du tenker på noe annet. Her rangeres rutinene etter
// hvor godt de passer innlegget, så du bekrefter et forslag i stedet for å lete.
function ordFra(t){
  return String(t||'').toLowerCase()
    .replace(/[^\wåæøéèü\s]/g,' ').split(/\s+/)
    .filter(function(w){return w.length>2;});
}
// Enkel stammeklipp: «turen» og «turer» skal treffe «tur». Endelsene er de
// vanlige norske bøyningene; ikke perfekt, men godt nok til å rangere.
function stam(w){
  return String(w).replace(/(ene|enes|ene|erne|ene|ens|ers|er|en|et|a|e)$/,'');
}
function ordTreff(a,b){
  if(a===b)return true;
  var sa=stam(a),sb=stam(b);
  return sa.length>2&&sb.length>2&&(sa===sb||sa.indexOf(sb)===0||sb.indexOf(sa)===0);
}
function rutineForslagScore(r,tekst,tags,cats){
  var score=0;
  var tOrd=ordFra(tekst);
  ordFra(r.name).forEach(function(rw){
    if(tOrd.some(function(tw){return ordTreff(rw,tw);}))score+=3;
  });
  (r.tags||[]).forEach(function(rt){
    if((tags||[]).indexOf(rt)>=0)score+=2;
    if(tOrd.some(function(tw){return ordTreff(rt,tw);}))score+=1;
  });
  (r.cats||[]).forEach(function(rc){if((cats||[]).indexOf(rc)>=0)score+=1;});
  return score;
}

}

// Beredskapsrelevante punkter havner automatisk i Beredskapslageret, med samme
// syncId som den vanlige avhaknings-synken bruker — så «på plass» holder seg i takt
// begge veier. Fjernes merket, fjernes kopien fra Beredskapslageret igjen.
// Speiler en plasseringssti (med eventuelle nivåer over) fra én liste til en annen,
// og gir tilbake id-en til den innerste seksjonen i målliste
function speilSeksjonssti(src,target,sectionId){
  if(!sectionId)return null;
  var sti=[],guard=0;
  var sid=sectionId;
  while(sid&&guard++<10){
    var sc=(src.sections||[]).find(function(x){return x.id===sid;});
    if(!sc)break;
    sti.unshift(sc);
    sid=sc.parentId||'';
  }
  if(!sti.length)return null;
  target.sections=target.sections||[];
  var parent='';
  var sisteId=null;
  sti.forEach(function(sc){
    var finnes=target.sections.find(function(x){
      return(x.name||'').toLowerCase()===(sc.name||'').toLowerCase()&&(x.parentId||'')===parent;
    });
    if(!finnes){
      finnes={id:'sc'+Date.now()+Math.random().toString(36).slice(2,6),name:sc.name,parentId:parent};
      target.sections.push(finnes);
    }
    parent=finnes.id;
    sisteId=finnes.id;
  });
  return sisteId;
}
function ensureBeredskapSync(invId,itemId,skalVaereMed){
  var ber=findFixedList('beredskap');if(!ber)return;
  var inv=invById(invId);if(!inv||inv.fixed==='beredskap')return;
  var it=(inv.items||[]).find(function(x){return x.id===itemId;});if(!it)return;
  if(!it.syncId)it.syncId=it.id;
  var existing=itemOnList(it,ber);
  if(skalVaereMed&&!existing){
    var values={};
    (ber.fields||[]).forEach(function(tf){
      var srcField=(inv.fields||[]).find(function(sf){return sf.name.toLowerCase()===tf.name.toLowerCase();});
      if(srcField&&(it.values||{})[srcField.id])values[tf.id]=it.values[srcField.id];
    });
    var srcVals=it.values||{};
    if(listHasQty(ber)&&srcVals.__qty){values.__qty=srcVals.__qty;if(srcVals.__unit)values.__unit=srcVals.__unit;}
    if(srcVals.__farge)values.__farge=srcVals.__farge;
    if(srcVals.__merke)values.__merke=srcVals.__merke;
    if(srcVals.__tilstand&&inv.fixed!=='forbruksvarer')values.__tilstand=srcVals.__tilstand;
    if(listHasDetails(ber)&&srcVals.__kjopt)values.__kjopt=srcVals.__kjopt;
    if(listHasExp(ber)&&srcVals.__exp)values.__exp=srcVals.__exp;
    // Plasseringen ligger i __p1/__p2/__p3, ikke i sectionId
    if(srcVals.__p1)values.__p1=srcVals.__p1;
    if(srcVals.__p2)values.__p2=srcVals.__p2;
    if(srcVals.__p3)values.__p3=srcVals.__p3;
    values.__bered='ja';
    ber.items=(ber.items||[]).concat([{
      id:'ii'+Date.now()+Math.random().toString(36).slice(2,6),
      sectionId:speilSeksjonssti(inv,ber,it.sectionId),
      name:it.name,note:it.note||'',values:values,have:!!it.have,syncId:it.syncId
    }]);
  } else if(skalVaereMed&&existing){
    // Ekte tvilling: navn, notat og alle relevante felter holdes i takt med kilden.
    // «__berkat» er kopiens eget felt (hvilke beredskapsunderkategorier den er valgt til)
    // og skal derfor ikke overskrives.
    existing.sectionId=speilSeksjonssti(inv,ber,it.sectionId);
    existing.name=it.name;
    existing.note=it.note||'';
    var sv=it.values||{};
    var beholdt=(existing.values||{}).__berkat||'';
    var nyeV={};
    (ber.fields||[]).forEach(function(tf){
      var srcField=(inv.fields||[]).find(function(sf){return sf.name.toLowerCase()===tf.name.toLowerCase();});
      if(srcField&&sv[srcField.id])nyeV[tf.id]=sv[srcField.id];
    });
    if(listHasQty(ber)&&sv.__qty){nyeV.__qty=sv.__qty;if(sv.__unit)nyeV.__unit=sv.__unit;}
    if(sv.__farge)nyeV.__farge=sv.__farge;
    if(sv.__merke)nyeV.__merke=sv.__merke;
    if(sv.__tilstand&&inv.fixed!=='forbruksvarer')nyeV.__tilstand=sv.__tilstand;
    if(listHasDetails(ber)&&sv.__kjopt)nyeV.__kjopt=sv.__kjopt;
    if(listHasExp(ber)&&sv.__exp)nyeV.__exp=sv.__exp;
    if(sv.__p1)nyeV.__p1=sv.__p1;
    if(sv.__p2)nyeV.__p2=sv.__p2;
    if(sv.__p3)nyeV.__p3=sv.__p3;
    nyeV.__bered='ja';
    if(beholdt)nyeV.__berkat=beholdt;
    existing.values=nyeV;
  } else if(!skalVaereMed&&existing){
    ber.items=(ber.items||[]).filter(function(x){return x.id!==existing.id;});
  }
}

function importJSON(){

        save();render();

  };

}

// Rutine-detaljside: hvordan går det med rutinen, og alle dagbokinnlegg du har
// knyttet til den (via routineIds-feltet p\u00e5 selve innlegget).
// Gullstjerne på rutiner — avhaking i loggen og dagbokinnlegg tagget til rutinen
// teller likt inn i \u00e9n samlet sum. F\u00f8rste milep\u00e6l ved 10, s\u00e5 50, deretter en
// dobling for hver: 100, 200, 400, 800 \u2026
function rutineMilepaeler(){
  var ut=[10,50,100],v=100;
  while(v<200000){v*=2;ut.push(v);}
  return ut;
}
function rutineTotalTelling(r){
  // Avhaking og koblet innlegg kan gjelde samme dag — særlig nå som innlegget
  // foreslår avhakingen. Telles per dag, ikke per hendelse.
  var sett={};
  (r.log||[]).forEach(function(k){sett[k]=1;});
  entriesForRoutine(r.id).forEach(function(e){sett[rutineLoggNokkel(r,e.date)]=1;});
  return Object.keys(sett).length;
}
function rutineStjerneMilepael(r){
  var total=rutineTotalTelling(r);
  var mp=rutineMilepaeler(),naadd=null;
  for(var i=0;i<mp.length;i++){if(total>=mp[i])naadd=mp[i];else break;}
  return naadd;
}
function rutineStjerneHTML(r){
  var mp=rutineStjerneMilepael(r);
  if(!mp)return'';
  return' <span style="color:#D9A93B;font-size:11px;font-weight:700;white-space:nowrap" title="'+rutineTotalTelling(r)+' ganger totalt \u2014 avhaking og tagget dagboksinnlegg talt sammen">\u2605 '+mp+'</span>';
}
function entriesForRoutine(routineId){
  return entries.filter(function(e){return(e.routineIds||[]).indexOf(routineId)>=0;})

function cloudScale(){
  var g=allTags();var m=0;
  Object.keys(g).forEach(function(k){if(g[k]>m)m=g[k];});

}
function cloudWordsHTML(counts,clickable,limit,kompakt){
  // Én felles motor for alle ordskyer — samme størrelser, avstand og utseende
  var words=Object.keys(counts).filter(function(w){return counts[w]>0;});
  if(!words.length)return'';
  // Ved grense: plukk de mest brukte først, men vis dem alfabetisk som ellers
  if(limit&&words.length>limit){
    words=words.slice().sort(function(a,b){return counts[b]-counts[a]||nbSort(a,b);}).slice(0,limit);
  }
  words.sort(nbSort);
  // Felles skala for ALLE ordskyer: samme ord får samme størrelse overalt
  var scale=cloudScale();
  return'<div class="cloud'+(kompakt?' kompakt':'')+'">'+words.map(function(w){
    var c=counts[w];
    var ratio=Math.log(1+c)/Math.log(1+scale);
    // Grunnstørrelse følger en jevn logaritmisk skala; over gitte terskler får ordet
    // et ekstra hopp, så forskjellen mellom «ofte» og «veldig ofte» blir tydelig.
    var size=11+Math.round(ratio*15);
    var lv=Math.min(5,Math.max(1,1+Math.floor(ratio*4.99)));
    if(c>=1000){lv=7;size+=13;}
    else if(c>=750){lv=6;size+=8;}
    else if(c>=500){size+=6;}
    else if(c>=250){size+=3;}
    var cls='cloud-word lv'+lv+(c>10&&c<750?' hot':'');
    if(clickable)return'<button class="'+cls+'" style="font-size:'+size+'px" onclick="goTagAlle(\''+q(w)+'\')">#'+esc(w)+'</button>';
    return'<span class="'+cls+'" style="font-size:'+size+'px;cursor:default">#'+esc(w)+'</span>';
  }).join('')+'</div>';
}
function cloudHTML(counts,clickable,limit,kompakt){
  var c=cloudWordsHTML(counts,clickable,limit,kompakt);
  return c?'<div class="card">'+c+'</div>':'';
}

  }

}

    routines.forEach(function(r){r.cats=strip(r.cats||[]);});

// ── Deler i et innlegg ─────────────────────────────────────────────────
// Ett innlegg kan romme flere episoder: «tur med Jenny» og «operaen med Knut».
// Uten deler fester alle stikkord seg til hele innlegget, og analysen tror at
// Jenny hørte til operaen. Delene holder naboskapet riktig.
//
// e.cats og e.tags beholdes som unionen av alle delene, slik at ordskyer,
// rapporter og filtre virker nøyaktig som før. Delene ligger ved siden av.
//
// I skjemaet speiler f.cats/f.tags den delen som er åpen, slik at
// catChipSection, tagSectionHTML og toggle-funksjonene kan brukes uendret.
function bolkerFra(e){
  if(e&&e.bolker&&e.bolker.length)return e.bolker.map(function(b){
    return{cats:[].concat(b.cats||[]),tags:[].concat(b.tags||[])};
  });
  return[{cats:[].concat((e&&e.cats)||[]),tags:[].concat((e&&e.tags)||[])}];
}
function lagreAktivBolk(f){
  if(!f.bolker||!f.bolker.length)return;
  var i=f._bolk||0;
  if(!f.bolker[i])f.bolker[i]={cats:[],tags:[]};
  f.bolker[i].cats=[].concat(f.cats||[]);
  f.bolker[i].tags=[].concat(f.tags||[]);
}
function byttBolk(i){
  var f=mf();
  lagreAktivBolk(f);
  f._bolk=i;
  var b=f.bolker[i]||{cats:[],tags:[]};
  f.cats=[].concat(b.cats);f.tags=[].concat(b.tags);
  f._tagIn='';
  render();updateSaveBtn();
}
function leggTilBolk(){
  var f=mf();
  lagreAktivBolk(f);
  f.bolker=[].concat(f.bolker||[],[{cats:[],tags:[]}]);
  byttBolk(f.bolker.length-1);
}
function fjernBolk(i){
  var f=mf();
  lagreAktivBolk(f);
  if((f.bolker||[]).length<2)return;
  f.bolker=f.bolker.filter(function(_,j){return j!==i;});
  byttBolk(Math.max(0,Math.min(f._bolk||0,f.bolker.length-1)));
}
// Deler uten innhold kastes; unionen er det innlegget merkes med.
function bolkerUt(f){
  lagreAktivBolk(f);
  var b=(f.bolker||[]).filter(function(x){return(x.cats||[]).length||(x.tags||[]).length;});
  return b.length?b:[{cats:[].concat(f.cats||[]),tags:[].concat(f.tags||[])}];
}
function unionAv(bolker,felt){
  var ut=[];
  bolker.forEach(function(b){(b[felt]||[]).forEach(function(v){if(ut.indexOf(v)<0)ut.push(v);});});
  return ut;
}
function bolkFaneHTML(f){
  var b=f.bolker||[];
  var h='<div class="chips" style="margin-bottom:2px">';
  b.forEach(function(_,i){
    h+='<button class="chip'+((f._bolk||0)===i?' on':'')+'" onclick="byttBolk('+i+')">Del '+(i+1)+'</button>';
  });
  h+='<button class="chip" onclick="leggTilBolk()">+ ny del</button>';
  if(b.length>1)h+='<button class="chip" onclick="fjernBolk('+(f._bolk||0)+')">\u2715 fjern Del '+((f._bolk||0)+1)+'</button>';
  h+='</div>';
  if(b.length>1){
    h+='<div class="hint" style="margin-bottom:4px">Kategorier og stikkord under h\u00f8rer bare til Del '+((f._bolk||0)+1)+'. Teksten er felles.</div>';
  }
  return h;
}

function submitEvent(){
  flushTags(mf());
  var f=mf();var name=(f.name||'').trim();if(!name)return;

// Det brukeren holder p\u00e5 \u00e5 skrive akkurat n\u00e5 \u2014 alt etter siste komma,
// slik at forslagene f\u00f8lger stikkordet under fingeren og ikke hele feltet.
function tagFragmentAv(raw){
  var t=String(raw||'');
  var i=t.lastIndexOf(',');
  return (i<0?t:t.slice(i+1)).trim().toLowerCase();
}
// Forslag mens du skriver: treff i starten av ordet f\u00f8rst, deretter treff inni det.
// Delt mellom hurtiginnlegget p\u00e5 forsida og stikkordfeltet i skjemaene.
function tagForslag(frag,valgt){
  if(!frag)return[];
  valgt=valgt||[];
  var start=[],inni=[];
  Object.keys(allTagsPool()).sort(nbSort).forEach(function(t){
    if(valgt.indexOf(t)>=0||t===frag)return;
    if(t.indexOf(frag)===0)start.push(t);
    else if(t.indexOf(frag)>0)inni.push(t);
  });
  return start.concat(inni).slice(0,8);
}
function tagFragment(f){return tagFragmentAv(f._tagIn);}
function tagSuggestions(f){return tagForslag(tagFragment(f),f.tags||[]);}
function tagInput(v){mf()._tagIn=v;render();}
// Velger et forslag: bytter ut fragmentet som ble skrevet, og lar det som
// eventuelt sto foran siste komma st\u00e5 urørt.
function pickTagSuggestion(t){
  var f=mf();
  if(!f.tags.includes(t))f.tags=[].concat(f.tags,[t]);
  var raw=(f._tagIn||'');var i=raw.lastIndexOf(',');
  f._tagIn=(i<0?'':raw.slice(0,i+1));
  render();
  var ni=document.getElementById('tag-inp');if(ni)ni.focus();
}

/* ── Kompakte kategoribokser for rutiner og hendelser ── */
function freqShort(r){
  if(r.freq==='daily')return (r.days||[]).length?(r.days||[]).map(function(i){return UKEDAGER_FULL[i].slice(0,3);}).join(', '):'daglig';
  if(r.freq==='yearly')return 'årlig';
  var pw=Number(r.perWeek)>1?' \u00d7'+Number(r.perWeek):'';
  if(r.freq==='weekly')return 'ukentlig'+pw;
  if(r.freq==='odd')return 'oddetallsuker'+pw;
  if(r.freq==='even')return 'partallsuker'+pw;
  return 'hver måned';
}
function evShort(e){
  if(!e.month)return '';
  return (e.day?e.day+'. ':'')+MND_FULL[e.month-1].slice(0,3);
}
function routineDoneNow(r){
  var log=r.log||[];
  var months=r.months||[];
  if(months.length&&!months.includes(curMonth))return null; // ikke satt opp denne måneden
  if(r.freq==='daily'){
    return log.includes('d'+isoDate(today));
  }
  if(r.freq==='yearly'){
    return log.includes('y'+curYear);
  }
  if(isWeekly(r)){
    var wk=weekNum(today);
    if(r.freq==='odd'&&wk%2===0)return null;
    if(r.freq==='even'&&wk%2===1)return null;
    var wKey='w'+weekYear(today)+'-'+pad(wk);
    var n=Number(r.perWeek)||1;
    if(n<=1)return log.includes(wKey);
    for(var gi=1;gi<=n;gi++){if(!log.includes(wKey+'#'+gi))return false;}
    return true;
  }
  return log.includes(curYear+'-'+pad(curMonth));
}
function routineStatusStyle(r){
  var d=routineDoneNow(r);
  if(d===null)return'';
  return d?'background:#E1F1DE':'background:#FDF3C7';
}
function resultStatus(r){
  if(!r)return null;
  // Leser nå prosjektets felter: ferdigstilt og startdato
  if(r.completedDate||r.achieved)return'maintained';
  var sd=r.startDate||((r.startMonth&&r.startYear)?(r.startYear+'-'+pad(r.startMonth)+'-01'):'');
  if(sd&&sd>isoDate(today))return'queued';
  return'active';
}
function resultStatusStyle(status){
  if(status==='maintained')return'background:#E1F1DE';
  if(status==='active')return'background:#FDF3C7';
  if(status==='queued')return'opacity:.5';
  return'';
}

function periodTodoItems(scope){
  // scope: {wk, wKey, ym, m, y, includeDatedWeek (kun dagbok), includeUndated (kun uke), onlyGroup ('daily'|'weekly'|'monthly'|'yearly')}
  var out=[];var total=0;
  var pushR=function(r,key,sub){
    total++;
    var done=(r.log||[]).includes(key);
    var rk='r_'+r.id+'_'+key;
    if(done&&!recentDone[rk])return;
    out.push({label:r.name,sub:sub,done:done,key:rk,cat:mainCatOf(r.cats),click:"boxToggleRoutine('"+q(r.id)+"','"+q(key)+"')",routineId:r.id,trackHours:!!r.trackHours,
      minste:(r.minste||''),minsteClick:"boxToggleRoutine('"+q(r.id)+"','"+q(key)+"',1)",
      minsteGjort:(r.minsteLog||[]).indexOf(key)>=0,
      anker:ankerLinjeTekst(r),nesteUt:!!nesteUt['r_'+r.id]});
  };
  routines.forEach(function(r){
    var months=r.months||[];
    if(months.length&&!months.includes(scope.m))return;
    var grp=r.freq==='daily'?'daily':r.freq==='yearly'?'yearly':isWeekly(r)?'weekly':'monthly';
    if(scope.onlyGroup&&scope.onlyGroup!==grp)return;
    if(r.freq==='daily'){
      // Daglige rutiner vises bare i dagbokboksene, aldri i kalenderen
      if(!scope.daily)return;
      var rd=r.days||[];
      if(rd.length&&rd.indexOf(dow(new Date(scope.daily+'T00:00:00')))<0)return;
      pushR(r,'d'+scope.daily,rd.length?UKEDAGER_FULL[dow(new Date(scope.daily+'T00:00:00'))]:'daglig');
    } else if(r.freq==='yearly'){
      pushR(r,'y'+scope.y,'\u00e5rlig');
    } else if(isWeekly(r)){
      if(r.freq==='odd'&&scope.wk%2===0)return;
      if(r.freq==='even'&&scope.wk%2===1)return;
      var n=Number(r.perWeek)||1;
      if(n<=1){
        pushR(r,scope.wKey,'');
      } else {
        var log=r.log||[];var dn=0;
        for(var gi=1;gi<=n;gi++){if(log.includes(scope.wKey+'#'+gi))dn++;}
        for(var gj=1;gj<=n;gj++){pushR(r,scope.wKey+'#'+gj,dn+' av '+n+' denne uka');}
      }
    } else {
      pushR(r,scope.ym,'hver m\u00e5ned');
    }
  });
  if(scope.includeDatedWeek){
    scope._seen={};
    var ws=mondayOf(today);
    for(var i=0;i<7;i++){
      var d=new Date(ws);d.setDate(d.getDate()+i);
      (function(d){
        var dy=d.getFullYear(),dm=d.getMonth()+1,dd=d.getDate();
        eventsOnDate(dm,dd,dy).forEach(function(o){
          var k=o.e.id+'_'+o.occYear;
          if(scope._seen[k])return;
          scope._seen[k]=1;
          total++;
          var done=evDone(o.e,o.occYear);
          if(done&&!recentDone['e_'+k])return;
          var isTod=isoDate(d)===isoDate(today);
          var sub=o.e.toDay?evSpanTxt(o.e):(isTod?'i dag':UKEDAGER_FULL[dow(d)]+' '+dd+'.');
          out.push({label:o.e.name,sub:sub,done:done,cat:mainCatOf(o.e.cats),click:"boxToggleEvent('"+q(o.e.id)+"',"+o.occYear+")"});
        });
      })(d);
    }
  }
  if(scope.includeUndated){
    monthEventsFor(scope.m,scope.y).forEach(function(e){
      if(e.day)return;
      total++;
      var done=evDone(e,scope.y);
      if(done&&!recentDone['e_'+e.id+'_'+scope.y])return;
      out.push({label:e.name,sub:'i l\u00f8pet av m\u00e5neden',done:done,cat:mainCatOf(e.cats),click:"boxToggleEvent('"+q(e.id)+"',"+scope.y+")"});
    });
  }
  return{items:out,total:total};
}

function monthEventsFor(m,y){
  return events.filter(function(e){
    if(e.month!==m)return false;
    if(!e.repeat)return Number(e.year)===y;
    var start=Number(e.year);
    if(y<start)return false;
    var iv=Number(e.interval)||1;
    return(y-start)%iv===0;
  });
}

/* ── Bursdager: Dunbars tall og runde år ── */
var BDAY_MAX=150;
// Taket er Dunbars tall for levende relasjoner. En minnebursdag er ikke en slik
// relasjon, og skal ikke spise av plassen.
function bdayCount(){return events.filter(function(e){return e.bday&&!erMinne(e);}).length;}
function bdayNextAge(e){
  var s=Number(e.sinceYear);if(!(s>0))return null;
  var passed=(e.month<curMonth)||(e.month===curMonth&&(e.day||31)<today.getDate());
  var age=(passed?curYear+1:curYear)-s;
  return age>0?age:null;
}
function isRoundBdayNext(e){
  if(!e.bday)return false;
  var a=bdayNextAge(e);
  return a!==null&&a%10===0;
}
function isRoundBdayInYear(e,y){
  if(!e.bday)return false;
  var n=evYears(e,y);
  return n!==null&&n%10===0;
}

function weekNum(date){
  var d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
  var day=(d.getUTCDay()+6)%7;
  d.setUTCDate(d.getUTCDate()-day+3);
  var thu=d.getTime();
  d.setUTCMonth(0,1);
  if(d.getUTCDay()!==4)d.setUTCMonth(0,1+((4-d.getUTCDay())+7)%7);
  return 1+Math.round((thu-d.getTime())/(7*24*3600*1000));
}

function isWeeklyFreq(fq){return fq==='weekly'||fq==='odd'||fq==='even';}
function isWeekly(r){return isWeeklyFreq(r.freq);}
function weekYear(date){
  var d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
  var day=(d.getUTCDay()+6)%7;
  d.setUTCDate(d.getUTCDate()-day+3);
  return d.getUTCFullYear();
}
function routineWeeksIn(m,y,freq){
  var daysIn=new Date(y,m,0).getDate();
  var seen={},list=[];
  for(var d=1;d<=daysIn;d++){
    var dt=new Date(y,m-1,d);
    var wn=weekNum(dt);
    var key='w'+weekYear(dt)+'-'+pad(wn);
    if(seen[key])continue;seen[key]=1;
    if(freq==='odd'&&wn%2===0)continue;
    if(freq==='even'&&wn%2===1)continue;
    list.push({week:wn,key:key});
  }
  return list;
}

function mensDagErFaktisk(dato){
  var iToday2=isoDate(today);
  return mens.some(function(m){
    if(!m.start||dato<m.start)return false;
    var slutt=m.end||(m.start<=iToday2?iToday2:m.start); // pågående periode: regnes til og med i dag
    return dato<=slutt;
  });
}
// Projiserer de neste 12 forventede periodene ut fra snittsyklus og -varighet,
// slik at gradering vises riktig uansett hvilket \u00e5r i kalenderen som er \u00e5pen
function mensForventedeSett(){
  var snitt=mensSnittSyklus();var siste=mensSiste();
  if(!snitt||!siste)return{};
  var lengde=Math.max(1,Math.round(mensSnittLengde()||5));
  var sett={};
  var d=new Date(siste.start+'T00:00:00');
  for(var i=1;i<=12;i++){
    d.setDate(d.getDate()+snitt);
    for(var k=0;k<lengde;k++){
      var dd=new Date(d);dd.setDate(dd.getDate()+k);
      sett[isoDate(dd)]=true;
    }
  }
  return sett;
}

function vimpelKvalifisert(a){
